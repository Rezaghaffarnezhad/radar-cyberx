<!DOCTYPE html>
<html lang="fa" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تلسکوپ - نقشه و چت زنده</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');
        body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0e1621; color: #f5f5f5; font-family: 'Vazirmatn', sans-serif; }
        .map-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .glass-box {
            background: rgba(23, 33, 43, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tg-card { background: #17212b; border: 1px solid rgba(255,255,255,0.03); }

        /* نشانگر موقعیت مکانی من با سایه متحرک بازشونده (Pulse) و شکل هندسی متمایز */
        .my-animated-marker {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: rgba(66, 133, 244, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: google-radar-pulse 2.2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        .my-marker-inner {
            width: 40px;
            height: 40px;
            border-radius: 12px; /* شکل هندسی گوشه‌گرد متمایز برای نمایش موقعیت من */
            border: 3px solid #ffffff;
            overflow: hidden;
            background: #4285f4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.6);
        }
        @keyframes google-radar-pulse {
            0% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(66, 133, 244, 0.6), 0 0 0 0 rgba(66, 133, 244, 0.4); }
            50% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(66, 133, 244, 0), 0 0 0 35px rgba(66, 133, 244, 0.15); }
            100% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(66, 133, 244, 0), 0 0 0 0 rgba(66, 133, 244, 0); }
        }

        /* نشانگر کاربران دیگر روی نقشه به شکل دایره‌ای با حاشیه سبز */
        .other-user-pin {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #17212b;
            border: 2.5px solid #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 13px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .other-user-pin:hover { transform: scale(1.12); }

        .leaflet-container { background-color: #0e1621 !important; }
        .dark-map .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }

        .transparent-btn { background: transparent !important; border: none !important; box-shadow: none !important; }
        .transparent-btn:hover { background: rgba(255, 255, 255, 0.08) !important; }

        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body class="relative flex flex-col h-full justify-between select-none">

    <!-- نقشه زنده -->
    <div class="relative w-full h-full">
        <div id="map" class="map-container dark-map"></div>
        
        <!-- کادر بالای صفحه -->
        <div class="absolute top-3 left-3 right-3 z-10 pointer-events-none">
            <div class="glass-box px-3 py-2 rounded-2xl flex items-center justify-between gap-2 shadow-2xl pointer-events-auto">
                <div class="flex items-center gap-2">
                    <!-- کلیک روی دکمه آنلاین برای باز کردن لیست افراد آنلاین -->
                    <button onclick="openOnlineUsersModal()" id="online-count-badge" class="text-[11px] font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-xl hover:bg-emerald-500/20 transition cursor-pointer">0 آنلاین 🟢</button>
                    <button onclick="openGlobalChat()" class="text-[11px] font-bold text-blue-400 bg-blue-500/10 px-2.5 py-1 rounded-xl hover:bg-blue-500/20 transition">چت عمومی 💬</button>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="toggleMapTheme()" class="w-7 h-7 rounded-xl flex items-center justify-center text-xs text-white bg-slate-800/60 hover:bg-slate-700 transition" title="تغییر تم">🌓</button>
                    <div onclick="openProfileModal()" class="flex items-center gap-1.5 cursor-pointer hover:opacity-80 transition">
                        <span id="top-my-name" class="font-bold text-xs text-white truncate max-w-[80px]">کاربر</span>
                        <div id="top-my-avatar" class="w-7 h-7 rounded-full bg-[#2b5278] flex items-center justify-center font-bold text-white text-xs overflow-hidden shadow">ک</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- دکمه تنظیمات شعاع به شکل چرخ‌دنده در سمت چپ -->
        <div class="absolute bottom-24 left-4 z-10 flex flex-col items-center pointer-events-auto">
            <button onclick="openRadiusSettingsModal()" class="w-11 h-11 glass-box rounded-2xl flex items-center justify-center text-blue-400 shadow-xl transition hover:scale-105 active:scale-95" title="تنظیمات شعاع">
                <svg class="w-6 h-6 animate-spin-slow" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
            </button>
        </div>

        <!-- دکمه‌های کنترل موقعیت و انتخاب دستی در سمت راست -->
        <div class="absolute bottom-6 right-4 z-10 flex flex-col gap-2 pointer-events-auto">
            <button onclick="enableManualLocationSelect()" class="w-12 h-12 glass-box rounded-2xl flex items-center justify-center text-blue-400 transition hover:scale-105 active:scale-95 shadow-xl" title="انتخاب لوکیشن دستی">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </button>
            <button onclick="centerToMyLocation()" class="w-12 h-12 transparent-btn rounded-2xl flex items-center justify-center text-white transition hover:scale-105 active:scale-95" title="موقعیت من">
                <svg class="w-7 h-7 text-blue-400 drop-shadow-md" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
        </div>
    </div>

    <!-- مودال تنظیمات شعاع (شامل فیلد و اسلایدر دستی) -->
    <div id="radius-settings-modal" class="hidden absolute inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onclick="closeRadiusSettingsModal()">
        <div class="tg-card w-full max-w-xs rounded-2xl p-5 flex flex-col items-center gap-4 shadow-2xl border border-slate-700" onclick="event.stopPropagation()">
            <h3 class="font-bold text-sm text-white flex items-center gap-2">⚙️ تنظیمات شعاع نقشه</h3>
            <div class="w-full flex flex-col gap-3">
                <div class="flex justify-between items-center text-xs text-slate-300">
                    <span>شعاع فعلی:</span>
                    <span id="modal-radius-value" class="text-blue-400 font-bold">15 کیلومتر</span>
                </div>
                <input id="modal-radius-slider" type="range" min="0.5" max="50" step="0.5" value="15" oninput="onModalRadiusChange(this.value)" class="w-full accent-blue-500 cursor-pointer">
                <div class="flex items-center gap-2 mt-1">
                    <input id="modal-radius-input" type="number" min="0.1" max="200" step="0.5" placeholder="مقدار برحسب کیلومتر..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    <button onclick="applyManualRadiusInput()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition">اعمال</button>
                </div>
            </div>
            <button onclick="closeRadiusSettingsModal()" class="w-full py-2 bg-[#2b5278] hover:bg-[#336394] rounded-xl font-medium text-xs text-white transition mt-2">تایید و بستن</button>
        </div>
    </div>

    <!-- مودال لیست افراد آنلاین -->
    <div id="online-users-modal" class="hidden absolute inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onclick="closeOnlineUsersModal()">
        <div class="tg-card w-full max-w-md rounded-2xl p-5 flex flex-col gap-4 shadow-2xl border border-slate-700 h-[80vh]" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                <div class="flex items-center gap-2">
                    <span class="text-base">🟢</span>
                    <h3 class="font-bold text-sm text-white">لیست افراد آنلاین در شعاع</h3>
                </div>
                <button onclick="closeOnlineUsersModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>
            <div id="online-users-list-container" class="flex-1 overflow-y-auto space-y-2.5 p-1">
                <!-- لیست کاربران آنلاین به صورت داینامیک پر می‌شود -->
            </div>
        </div>
    </div>

    <!-- مودال پروفایل شخصی -->
    <div id="profile-modal" class="hidden absolute inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onclick="closeProfileModal()">
        <div class="tg-card w-full max-w-sm rounded-2xl p-5 flex flex-col items-center gap-4 shadow-2xl border border-slate-700" onclick="event.stopPropagation()">
            <div id="profile-modal-avatar" class="w-20 h-20 rounded-full bg-[#2b5278] flex items-center justify-center text-2xl font-bold text-white overflow-hidden shadow-lg">ک</div>
            <div class="text-center">
                <h3 id="profile-modal-name" class="font-bold text-base text-white">نام کاربر</h3>
                <p id="profile-modal-username" class="text-xs text-blue-400 mt-1">@username</p>
            </div>
            <button onclick="closeProfileModal()" class="w-full py-2.5 bg-[#2b5278] hover:bg-[#336394] rounded-xl font-medium text-xs text-white transition">بستن</button>
        </div>
    </div>

    <!-- مودال پروفایل و چت خصوصی با سایر کاربران -->
    <div id="user-profile-modal" class="hidden absolute inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onclick="closeUserProfileModal()">
        <div class="tg-card w-full max-w-sm rounded-2xl p-5 flex flex-col gap-4 shadow-2xl border border-slate-700 max-h-[85vh]" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                <div class="flex items-center gap-3">
                    <div id="target-modal-avatar" class="w-11 h-11 rounded-full bg-[#2b5278] flex items-center justify-center font-bold text-white text-sm overflow-hidden shadow">ک</div>
                    <div>
                        <h3 id="target-modal-name" class="font-bold text-sm text-white">نام کاربر</h3>
                        <p id="target-modal-username" class="text-[11px] text-blue-400">@username</p>
                    </div>
                </div>
                <button onclick="closeUserProfileModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>
            <!-- باکس پیام‌های خصوصی واقعی -->
            <div id="private-chat-messages" class="flex-1 overflow-y-auto space-y-2.5 min-h-[220px] max-h-[280px] p-2 bg-slate-950/40 rounded-xl"></div>
            <!-- ارسال پیام خصوصی واقعی -->
            <div class="flex gap-2 pt-1">
                <input id="private-chat-input" type="text" placeholder="پیام خصوصی..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500" onkeydown="if(event.key==='Enter') sendPrivateMessage()">
                <button onclick="sendPrivateMessage()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition">ارسال</button>
            </div>
        </div>
    </div>

    <!-- مودال چت عمومی واقعی -->
    <div id="global-chat-modal" class="hidden absolute inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onclick="closeGlobalChat()">
        <div class="tg-card w-full max-w-md rounded-2xl p-5 flex flex-col gap-4 shadow-2xl border border-slate-700 h-[85vh]" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                <div class="flex items-center gap-2">
                    <span class="text-base">💬</span>
                    <h3 class="font-bold text-sm text-white">چت عمومی رادار</h3>
                </div>
                <button onclick="closeGlobalChat()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>
            <!-- باکس پیام‌های عمومی واقعی -->
            <div id="global-chat-messages" class="flex-1 overflow-y-auto space-y-3 p-2 bg-slate-950/40 rounded-xl"></div>
            <!-- ارسال پیام عمومی واقعی -->
            <div class="flex gap-2 pt-1">
                <input id="global-chat-input" type="text" placeholder="پیام در چت عمومی..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500" onkeydown="if(event.key==='Enter') sendGlobalMessage()">
                <button onclick="sendGlobalMessage()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition">ارسال</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://dxdskvkcmovotzxixxhd.supabase.co";
        const SUPABASE_KEY = "sb_publishable_3-rNuWmg9jAyPPQ89hE4ZQ_avo0wsPd";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        let map, myLocationMarker = null, radiusCircle = null, manualSelectMarker = null;
        let userMarkersOnMap = {};
        let currentCoords = { lat: 35.6892, lng: 51.3890 };
        let activeRadiusKm = 15;
        let isDarkMap = true;
        let activeUsersGlobalList = [];
        let targetUserForChat = null;
        let isManualSelecting = false;

        const tgUser = tg?.initDataUnsafe?.user || { 
            id: Math.floor(Math.random() * 900000) + 100000, 
            first_name: "کاربر مهمان", 
            last_name: "",
            username: "guest",
            photo_url: ""
        };

        let currentUser = { 
            telegram_id: tgUser.id, 
            name: `${tgUser.first_name || ''} ${tgUser.last_name || ''}`.trim(),
            username: tgUser.username || '',
            avatar_url: tgUser.photo_url || ''
        };

        window.addEventListener('DOMContentLoaded', async () => {
            map = L.map('map', { zoomControl: false }).setView([currentCoords.lat, currentCoords.lng], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }).addTo(map);

            setupUserProfileUI();
            await registerOrUpdateUserInSupabase();

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    currentCoords.lat = position.coords.latitude;
                    currentCoords.lng = position.coords.longitude;
                    if(map) map.setView([currentCoords.lat, currentCoords.lng], 15, { animate: true });
                    updateRadiusCircleOnMap();
                    updateMyHeartbeat();
                }, () => {
                    updateRadiusCircleOnMap();
                }, { enableHighAccuracy: true, timeout: 5000 });
            } else {
                updateRadiusCircleOnMap();
            }

            // کلیک روی نقشه برای انتخاب لوکیشن دستی
            map.on('click', (e) => {
                if(!isManualSelecting) return;
                currentCoords.lat = e.latlng.lat;
                currentCoords.lng = e.latlng.lng;
                isManualSelecting = false;
                map.getContainer().style.cursor = '';
                if(manualSelectMarker) { map.removeLayer(manualSelectMarker); manualSelectMarker = null; }
                updateRadiusCircleOnMap();
                updateMyHeartbeat();
            });

            // بروزرسانی لحظه‌ای (Realtime) با Supabase Subscriptions برای سرعت و پاسخگویی آنی
            supabaseClient.channel('realtime-telescope')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, () => { fetchUsersData(); })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => { 
                    fetchGlobalMessages(); 
                    if(targetUserForChat) fetchPrivateMessages(targetUserForChat.telegram_id);
                })
                .subscribe();

            setInterval(updateMyHeartbeat, 10000);
            fetchUsersData();
            fetchGlobalMessages();
        });

        async function registerOrUpdateUserInSupabase() {
            await supabaseClient.from('users').upsert([{
                telegram_id: currentUser.telegram_id,
                name: currentUser.name,
                username: currentUser.username,
                avatar_url: currentUser.avatar_url,
                latitude: currentCoords.lat,
                longitude: currentCoords.lng,
                last_seen: new Date().toISOString()
            }], { onConflict: 'telegram_id' });
        }

        async function updateMyHeartbeat() {
            if(!currentUser) return;
            await supabaseClient.from('users').update({
                latitude: currentCoords.lat,
                longitude: currentCoords.lng,
                last_seen: new Date().toISOString()
            }).eq('telegram_id', currentUser.telegram_id);
            fetchUsersData();
        }

        async function fetchUsersData() {
            const { data } = await supabaseClient.from('users').select('*');
            if(data) {
                activeUsersGlobalList = data;
                renderUsersOnMap();
                updateOnlineCountUI(data);
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getVisibleOnlineUsers() {
            const now = new Date();
            return activeUsersGlobalList.filter(u => {
                if(!u.latitude || !u.longitude || u.telegram_id === currentUser.telegram_id) return false;
                if(!u.last_seen) return false;
                const isOnline = (now - new Date(u.last_seen)) < 180000; // 3 دقیقه
                if(!isOnline) return false;
                const distance = calculateDistance(currentCoords.lat, currentCoords.lng, u.latitude, u.longitude);
                return distance <= activeRadiusKm;
            });
        }

        function renderUsersOnMap() {
            if(!map || !currentUser) return;

            Object.values(userMarkersOnMap).forEach(marker => map.removeLayer(marker));
            userMarkersOnMap = {};

            const visibleUsers = getVisibleOnlineUsers();

            visibleUsers.forEach(u => {
                const initial = (u.name || 'ک').charAt(0);
                const avatarInner = u.avatar_url ? `<img src="${u.avatar_url}" class="w-full h-full object-cover">` : initial;
                const html = `<div class="other-user-pin">${avatarInner}</div>`;
                
                const icon = L.divIcon({ html, iconSize: [44, 44], iconAnchor: [22, 22] });
                const marker = L.marker([u.latitude, u.longitude], { icon }).addTo(map);
                
                marker.on('click', () => { openTargetUserProfile(u); });
                userMarkersOnMap[u.telegram_id] = marker;
            });
        }

        function updateOnlineCountUI(usersList) {
            const now = new Date();
            let count = usersList.filter(u => {
                if(!u.last_seen) return false;
                return (now - new Date(u.last_seen)) < 180000;
            }).length;
            if(count === 0) count = 1;
            document.getElementById('online-count-badge').textContent = `${count} آنلاین 🟢`;
        }

        // مدیریت مودال لیست افراد آنلاین
        function openOnlineUsersModal() {
            const container = document.getElementById('online-users-list-container');
            container.innerHTML = '';
            const visibleUsers = getVisibleOnlineUsers();

            if(visibleUsers.length === 0) {
                container.innerHTML = `<div class="text-center text-xs text-slate-400 py-10">هیچ کاربر آنلاین دیگری در این شعاع یافت نشد.</div>`;
            } else {
                visibleUsers.forEach(u => {
                    const distance = calculateDistance(currentCoords.lat, currentCoords.lng, u.latitude, u.longitude).toFixed(1);
                    const initial = (u.name || 'ک').charAt(0);
                    const avatarHtml = u.avatar_url ? `<img src="${u.avatar_url}" class="w-full h-full object-cover">` : initial;
                    
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between p-3 bg-slate-900/60 rounded-xl border border-slate-800 hover:border-slate-700 transition cursor-pointer";
                    div.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-[#2b5278] flex items-center justify-center font-bold text-white text-xs overflow-hidden shadow">${avatarHtml}</div>
                            <div>
                                <h4 class="font-bold text-xs text-white">${u.name}</h4>
                                <p class="text-[10px] text-blue-400 mt-0.5">${distance} کیلومتر از شما</p>
                            </div>
                        </div>
                        <button class="bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">چت 💬</button>
                    `;
                    div.onclick = () => {
                        closeOnlineUsersModal();
                        openTargetUserProfile(u);
                    };
                    container.appendChild(div);
                });
            }
            document.getElementById('online-users-modal').classList.remove('hidden');
        }
        function closeOnlineUsersModal() { document.getElementById('online-users-modal').classList.add('hidden'); }

        // تنظیمات شعاع چرخ‌دنده و دستی
        function openRadiusSettingsModal() {
            document.getElementById('modal-radius-slider').value = activeRadiusKm;
            document.getElementById('modal-radius-value').textContent = `${activeRadiusKm} کیلومتر`;
            document.getElementById('modal-radius-input').value = activeRadiusKm;
            document.getElementById('radius-settings-modal').classList.remove('hidden');
        }
        function closeRadiusSettingsModal() { document.getElementById('radius-settings-modal').classList.add('hidden'); }

        function onModalRadiusChange(val) {
            activeRadiusKm = parseFloat(val);
            document.getElementById('modal-radius-value').textContent = `${activeRadiusKm} کیلومتر`;
            document.getElementById('modal-radius-input').value = activeRadiusKm;
            updateRadiusCircleOnMap();
            renderUsersOnMap();
        }

        function applyManualRadiusInput() {
            const inputVal = parseFloat(document.getElementById('modal-radius-input').value);
            if(!isNaN(inputVal) && inputVal > 0) {
                activeRadiusKm = inputVal;
                document.getElementById('modal-radius-slider').value = activeRadiusKm;
                document.getElementById('modal-radius-value').textContent = `${activeRadiusKm} کیلومتر`;
                updateRadiusCircleOnMap();
                renderUsersOnMap();
                closeRadiusSettingsModal();
            }
        }

        // انتخاب لوکیشن دستی روی نقشه
        function enableManualLocationSelect() {
            isManualSelecting = true;
            map.getContainer().style.cursor = 'crosshair';
            if(manualSelectMarker) map.removeLayer(manualSelectMarker);
            manualSelectMarker = L.marker([currentCoords.lat, currentCoords.lng], {
                draggable: true
            }).addTo(map);
            manualSelectMarker.on('dragend', function(event) {
                const markerPos = event.target.getLatLng();
                currentCoords.lat = markerPos.lat;
                currentCoords.lng = markerPos.lng;
                isManualSelecting = false;
                map.getContainer().style.cursor = '';
                map.removeLayer(manualSelectMarker);
                manualSelectMarker = null;
                updateRadiusCircleOnMap();
                updateMyHeartbeat();
            });
        }

        // چت عمومی واقعی
        function openGlobalChat() {
            document.getElementById('global-chat-modal').classList.remove('hidden');
            fetchGlobalMessages();
        }
        function closeGlobalChat() { document.getElementById('global-chat-modal').classList.add('hidden'); }

        async function fetchGlobalMessages() {
            const { data } = await supabaseClient.from('messages').select('*').is('receiver_id', null).order('created_at', { ascending: true }).limit(50);
            const container = document.getElementById('global-chat-messages');
            if(!container) return;
            container.innerHTML = '';
            if(data) {
                data.forEach(m => {
                    const isMe = m.sender_id === currentUser.telegram_id;
                    const div = document.createElement('div');
                    div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} gap-1`;
                    div.innerHTML = `
                        <span class="text-[10px] text-slate-400 px-1">${m.sender_name || 'کاربر'}</span>
                        <div class="max-w-[80%] px-3 py-2 rounded-2xl text-xs ${isMe ? 'bg-blue-600 text-white rounded-bl-2xl' : 'bg-slate-800 text-slate-200 rounded-br-2xl'}">${m.text}</div>
                    `;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            }
        }

        async function sendGlobalMessage() {
            const input = document.getElementById('global-chat-input');
            const text = input.value.trim();
            if(!text) return;
            await supabaseClient.from('messages').insert([{
                sender_id: currentUser.telegram_id,
                sender_name: currentUser.name,
                receiver_id: null,
                text: text,
                created_at: new Date().toISOString()
            }]);
            input.value = '';
            fetchGlobalMessages();
        }

        // چت خصوصی واقعی
        function openTargetUserProfile(u) {
            targetUserForChat = u;
            document.getElementById('target-modal-name').textContent = u.name;
            document.getElementById('target-modal-username').textContent = u.username ? `@${u.username}` : 'بدون نام کاربری';
            const avatarEl = document.getElementById('target-modal-avatar');
            if(u.avatar_url) {
                avatarEl.innerHTML = `<img src="${u.avatar_url}" class="w-full h-full object-cover">`;
            } else {
                avatarEl.textContent = (u.name || 'ک').charAt(0);
            }
            document.getElementById('user-profile-modal').classList.remove('hidden');
            fetchPrivateMessages(u.telegram_id);
        }

        function closeUserProfileModal() {
            document.getElementById('user-profile-modal').classList.add('hidden');
            targetUserForChat = null;
        }

        async function fetchPrivateMessages(targetId) {
            const { data } = await supabaseClient.from('messages').select('*')
                .or(`and(sender_id.eq.${currentUser.telegram_id},receiver_id.eq.${targetId}),and(sender_id.eq.${targetId},receiver_id.eq.${currentUser.telegram_id})`)
                .order('created_at', { ascending: true }).limit(50);
            
            const container = document.getElementById('private-chat-messages');
            if(!container) return;
            container.innerHTML = '';
            if(data) {
                data.forEach(m => {
                    const isMe = m.sender_id === currentUser.telegram_id;
                    const div = document.createElement('div');
                    div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} gap-1`;
                    div.innerHTML = `
                        <div class="max-w-[80%] px-3 py-2 rounded-2xl text-xs ${isMe ? 'bg-blue-600 text-white rounded-bl-2xl' : 'bg-slate-800 text-slate-200 rounded-br-2xl'}">${m.text}</div>
                    `;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            }
        }

        async function sendPrivateMessage() {
            if(!targetUserForChat) return;
            const input = document.getElementById('private-chat-input');
            const text = input.value.trim();
            if(!text) return;
            await supabaseClient.from('messages').insert([{
                sender_id: currentUser.telegram_id,
                sender_name: currentUser.name,
                receiver_id: targetUserForChat.telegram_id,
                text: text,
                created_at: new Date().toISOString()
            }]);
            input.value = '';
            fetchPrivateMessages(targetUserForChat.telegram_id);
        }

        function setupUserProfileUI() {
            document.getElementById('top-my-name').textContent = currentUser.name;
            document.getElementById('profile-modal-name').textContent = currentUser.name;
            document.getElementById('profile-modal-username').textContent = currentUser.username ? `@${currentUser.username}` : 'بدون نام کاربری';

            const avatarEl = document.getElementById('top-my-avatar');
            const modalAvatarEl = document.getElementById('profile-modal-avatar');
            
            if(currentUser.avatar_url) {
                avatarEl.innerHTML = `<img src="${currentUser.avatar_url}" class="w-full h-full object-cover">`;
                modalAvatarEl.innerHTML = `<img src="${currentUser.avatar_url}" class="w-full h-full object-cover">`;
            } else {
                const initial = currentUser.name.charAt(0);
                avatarEl.textContent = initial;
                modalAvatarEl.textContent = initial;
            }
        }

        function openProfileModal() { document.getElementById('profile-modal').classList.remove('hidden'); }
        function closeProfileModal() { document.getElementById('profile-modal').classList.add('hidden'); }

        function toggleMapTheme() {
            isDarkMap = !isDarkMap;
            const mapContainer = document.getElementById('map');
            if(isDarkMap) mapContainer.classList.add('dark-map');
            else mapContainer.classList.remove('dark-map');
        }

        function centerToMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    currentCoords.lat = position.coords.latitude;
                    currentCoords.lng = position.coords.longitude;
                    if(map) map.setView([currentCoords.lat, currentCoords.lng], 15, { animate: true });
                    updateRadiusCircleOnMap();
                    updateMyHeartbeat();
                }, () => {}, { enableHighAccuracy: true, timeout: 5000 });
            }
        }

        function updateRadiusCircleOnMap() {
            if(!map) return;
            if(radiusCircle) map.removeLayer(radiusCircle);
            radiusCircle = L.circle([currentCoords.lat, currentCoords.lng], {
                radius: activeRadiusKm * 1000,
                color: '#4285f4',
                weight: 1.5,
                fillColor: '#4285f4',
                fillOpacity: 0.08
            }).addTo(map);

            if(myLocationMarker) map.removeLayer(myLocationMarker);
            const avatarInner = currentUser.avatar_url ? `<img src="${currentUser.avatar_url}" class="w-full h-full object-cover">` : currentUser.name.charAt(0);
            const myHtml = `<div class="my-animated-marker"><div class="my-marker-inner">${avatarInner}</div></div>`;
            const myIcon = L.divIcon({ html: myHtml, iconSize: [68, 68], iconAnchor: [34, 34] });
            myLocationMarker = L.marker([currentCoords.lat, currentCoords.lng], { icon }).addTo(map);
        }
    </script>
</body>
</html>
