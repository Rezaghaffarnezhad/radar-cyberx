<!DOCTYPE html>
<html lang="fa" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نقشه مدرن و زنده</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');
        body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070b12; color: #f5f5f5; font-family: 'Vazirmatn', sans-serif; }
        .map-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* افکت شیشه‌ای فوق‌العاده مدرن (Glassmorphism) */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* نشانگر فوق‌العاده جذاب لوکیشن با افکت نئونی و پالس سه‌بعدی */
        .pulse-marker-container {
            position: relative;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pulse-core {
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.9), inset 0 2px 4px rgba(255, 255, 255, 0.6);
            z-index: 2;
            animation: core-bounce 2s infinite ease-in-out;
        }
        .pulse-ring-1 {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            animation: radar-wave 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            z-index: 1;
        }
        .pulse-ring-2 {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 50%;
            animation: radar-wave 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            animation-delay: 0.8s;
            z-index: 1;
        }

        @keyframes radar-wave {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(2.8); opacity: 0; }
        }
        @keyframes core-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* دکمه شناور مدرن با گرادانت و سایه نئونی */
        .action-btn {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95)) !important;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2) !important;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .action-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(59, 130, 246, 0.5) !important;
            box-shadow: 0 12px 30px rgba(59, 130, 246, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.3) !important;
        }
        .action-btn:active {
            transform: scale(0.94);
        }

        .leaflet-container { background-color: #070b12 !important; }
        .dark-map .leaflet-tile-pane { filter: brightness(0.55) invert(1) contrast(3) hue-rotate(200deg) saturate(0.25); }

        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body class="relative flex flex-col h-full justify-between select-none">

    <div id="view-map" class="view-section relative w-full h-full">
        <div id="map" class="map-container"></div>
        
        <!-- هدر شیشه‌ای بالا -->
        <div class="absolute top-4 left-4 right-4 z-10 pointer-events-none">
            <div class="glass-panel px-4 py-3 rounded-2xl flex items-center justify-between shadow-2xl pointer-events-auto">
                <div class="flex items-center gap-2.5">
                    <div class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-[0_0_12px_#3b82f6] animate-pulse"></div>
                    <span class="text-xs font-bold tracking-wide text-white">رادار موقعیت‌یاب</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="toggleMapTheme()" class="action-btn w-9 h-9 rounded-xl flex items-center justify-center text-base text-white transition" title="تغییر حالت نقشه">
                        <span id="theme-icon">🌙</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- دکمه شناور لوکیشن من در پایین صفحه -->
        <div class="absolute bottom-6 right-5 z-10 pointer-events-auto">
            <button onclick="centerToMyLocation()" class="action-btn w-13 h-13 rounded-2xl flex items-center justify-center text-white transition" title="موقعیت من">
                <svg class="w-6 h-6 text-blue-400 drop-shadow-[0_0_8px_rgba(59,130,246,0.6)]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
        </div>
    </div>

    <script>
        let map;
        let isDarkMap = false;
        let currentCoords = { lat: 35.6892, lng: 51.3890 };
        let tileLayer;
        let myLocationMarker = null;

        window.addEventListener('DOMContentLoaded', () => {
            map = L.map('map', { zoomControl: false }).setView([currentCoords.lat, currentCoords.lng], 14);
            
            // لایه پیش‌فرض (تم تاریک مدرن)
            tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }).addTo(map);

            updateMyLocationMarkerOnMap();

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    currentCoords.lat = position.coords.latitude;
                    currentCoords.lng = position.coords.longitude;
                    if(map) {
                        map.setView([currentCoords.lat, currentCoords.lng], 16, { animate: true });
                        updateMyLocationMarkerOnMap();
                    }
                }, () => {}, { enableHighAccuracy: true, timeout: 10000 });
            }
        });

        function updateMyLocationMarkerOnMap() {
            if(!map) return;
            if(myLocationMarker) {
                map.removeLayer(myLocationMarker);
            }
            
            const customIcon = L.divIcon({
                className: '',
                html: '<div class="pulse-marker-container"><div class="pulse-ring-1"></div><div class="pulse-ring-2"></div><div class="pulse-core"></div></div>',
                iconSize: [50, 50],
                iconAnchor: [25, 25]
            });

            myLocationMarker = L.marker([currentCoords.lat, currentCoords.lng], { icon: customIcon }).addTo(map);
        }

        function centerToMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    currentCoords.lat = position.coords.latitude;
                    currentCoords.lng = position.coords.longitude;
                    if(map) {
                        map.setView([currentCoords.lat, currentCoords.lng], 17, { animate: true });
                        updateMyLocationMarkerOnMap();
                    }
                }, () => {
                    if(map) {
                        map.setView([currentCoords.lat, currentCoords.lng], 17, { animate: true });
                        updateMyLocationMarkerOnMap();
                    }
                }, { enableHighAccuracy: true, timeout: 10000 });
            } else {
                if(map) {
                    map.setView([currentCoords.lat, currentCoords.lng], 17, { animate: true });
                    updateMyLocationMarkerOnMap();
                }
            }
        }

        function toggleMapTheme() {
            isDarkMap = !isDarkMap;
            const mapContainer = document.getElementById('map');
            const themeIcon = document.getElementById('theme-icon');
            
            if (tileLayer) map.removeLayer(tileLayer);

            if (isDarkMap) {
                mapContainer.classList.add('dark-map');
                tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }).addTo(map);
                themeIcon.textContent = '☀️';
            } else {
                mapContainer.classList.remove('dark-map');
                tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }).addTo(map);
                themeIcon.textContent = '🌙';
            }
            
            setTimeout(() => { updateMyLocationMarkerOnMap(); }, 100);
        }
    </script>
</body>
</html>
