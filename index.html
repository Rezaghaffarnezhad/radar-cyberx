<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar CyberX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            direction: rtl;
        }
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            border-left: 1px solid #1f293d;
            border-right: 1px solid #1f293d;
        }
        .cyber-header {
            background: #111827;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ffcc;
        }
        .badge-secure {
            background: #00ffcc;
            color: #0b0f19;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
        }
        .view-panel {
            display: none;
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .view-panel.active {
            display: flex;
            flex-direction: column;
        }
        .radar-screen {
            width: 250px;
            height: 250px;
            border: 2px solid #00ffcc;
            border-radius: 50%;
            margin: 40px auto;
            position: relative;
            background: radial-gradient(circle, rgba(0,255,204,0.1) 0%, rgba(11,15,25,0.9) 80%);
            overflow: hidden;
        }
        .radar-sweep {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 125px;
            height: 125px;
            background: linear-gradient(45deg, rgba(0,255,204,0.5) 0%, transparent 100%);
            transform-origin: top left;
            animation: sweep 4s linear infinite;
        }
        @keyframes sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .radar-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .radar-controls button, .profile-card button, .chat-input-area button {
            background: #111827;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 8px 15px;
            cursor: pointer;
            font-family: inherit;
            border-radius: 4px;
        }
        .cyber-nav {
            display: flex;
            background: #111827;
            border-top: 1px solid #1f293d;
        }
        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            color: #8892b0;
            padding: 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }
        .nav-btn.active {
            color: #00ffcc;
            border-top: 2px solid #00ffcc;
        }
        .profile-card input, .profile-card textarea, .chat-input-area input {
            width: 100%;
            background: #111827;
            border: 1px solid #1f293d;
            color: #fff;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-family: inherit;
            box-sizing: border-box;
        }
        .chat-box {
            flex: 1;
            border: 1px solid #1f293d;
            padding: 10px;
            margin-bottom: 10px;
            overflow-y: auto;
            background: #080c14;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <header class="cyber-header">
            <h1>RADAR CYBERX</h1>
            <span class="badge-secure">SECURE</span>
        </header>

        <main>
            <section id="radar-view" class="view-panel active">
                <div class="radar-screen">
                    <div class="radar-sweep"></div>
                </div>
                <div class="radar-controls">
                    <button onclick="triggerScan('1km')">باند ۱ ک.م</button>
                    <button onclick="triggerScan('5km')">باند ۵ ک.م</button>
                    <button onclick="triggerScan('10km')">باند ۱۰ ک.م</button>
                </div>
            </section>

            <section id="chat-view" class="view-panel">
                <div id="chat-messages" class="chat-box"></div>
                <div class="chat-input-area">
                    <input type="text" id="msg-input" placeholder="پیام سایبری خود را بنویسید...">
                    <button onclick="sendChatMessage()">ارسال</button>
                </div>
            </section>

            <section id="profile-view" class="view-panel">
                <div class="profile-card">
                    <input type="text" id="profile-name" placeholder="نام عامل (Agent Name)">
                    <textarea id="profile-bio" placeholder="بیوگرافی یا وضعیت..."></textarea>
                    <label style="display:block; margin-bottom:15px;">
                        <input type="checkbox" id="ghost-mode-toggle"> حالت روح (استتار کامل)
                    </label>
                    <button onclick="saveProfile()" style="width:100%;">ذخیره پروفایل</button>
                </div>
            </section>
        </main>

        <nav class="cyber-nav">
            <button onclick="switchTab('radar', this)" class="nav-btn active">رادار</button>
            <button onclick="switchTab('chat', this)" class="nav-btn">ارتباطات</button>
            <button onclick="switchTab('profile', this)" class="nav-btn">پروفایل</button>
        </nav>
    </div>

    <script>
        let currentUserId = "agent_" + Math.floor(Math.random() * 10000);

        function switchTab(tabName, element) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            if (tabName === 'radar') {
                document.getElementById('radar-view').classList.add('active');
            } else if (tabName === 'chat') {
                document.getElementById('chat-view').classList.add('active');
                loadMessages();
            } else if (tabName === 'profile') {
                document.getElementById('profile-view').classList.add('active');
            }
            element.classList.add('active');
        }

        function triggerScan(band) {
            fetch('/api/radar/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUserId, lat: 35.6892, lng: 51.3890, frequency_band: band, is_cloaked: false })
            })
            .then(res => res.json())
            .then(data => alert(`اسکن روی ${data.frequency_band} انجام شد. اهداف یافت شده: ${data.targets.length}`));
        }

        function saveProfile() {
            const name = document.getElementById('profile-name').value;
            const bio = document.getElementById('profile-bio').value;
            const ghostMode = document.getElementById('ghost-mode-toggle').checked;

            fetch('/api/profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUserId, name, bio, ghost_mode: ghostMode })
            })
            .then(res => res.json())
            .then(() => alert("پروفایل به‌روزرسانی شد!"));
        }

        function sendChatMessage() {
            const textInput = document.getElementById('msg-input');
            if (!textInput.value) return;

            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender: currentUserId, type: 'public', text: textInput.value })
            })
            .then(() => { textInput.value = ''; loadMessages(); });
        }

        function loadMessages() {
            fetch(`/api/chat?type=public&user_id=${currentUserId}`)
            .then(res => res.json())
            .then(data => {
                const chatBox = document.getElementById('chat-messages');
                chatBox.innerHTML = '';
                data.messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.style.marginBottom = "8px";
                    div.innerHTML = `<span style="color:#00ffcc">${msg.sender}:</span> ${msg.text}`;
                    chatBox.appendChild(div);
                });
            });
        }
    </script>
</body>
</html>
