<!DOCTYPE html>
<html lang="fa" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تست رادار کاربران</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');
        body, html { width: 100%; height: 100%; margin: 0; background: #0e1621; color: #f5f5f5; font-family: 'Vazirmatn', sans-serif; overflow: hidden; }
        .map-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .glass { background: rgba(23, 33, 43, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .dark-map .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }
        .my-pin { width: 24px; height: 24px; background: #3b82f6; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 15px #3b82f6; }
        .other-pin { width: 36px; height: 36px; background: #1e293b; border: 2px solid #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; overflow: hidden; }
    </style>
</head>
<body class="relative flex flex-col h-full justify-between">

    <div id="map" class="map-container dark-map"></div>

    <!-- هدر بالا برای تست اتصال -->
    <div class="absolute top-4 left-4 right-4 z-20 flex flex-col gap-2">
        <div class="glass p-3 rounded-2xl flex items-center justify-between shadow-2xl">
            <div class="flex items-center gap-2">
                <div id="my-avatar" class="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs overflow-hidden border border-blue-400">ک</div>
                <div>
                    <div id="my-name" class="font-bold text-xs text-white">در حال اتصال...</div>
                    <div id="status-text" class-[10px] text-emerald-400 font-mono">وضعیت: در حال بارگذاری</div>
                </div>
            </div>
            <button onclick="manualSync()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition shadow">
                ثبت موقعیت
            </button>
        </div>

        <!-- باکس دیباگ برای دیدن خطاهای احتمالی -->
        <div id="debug-box" class="glass p-2 rounded-xl text-[10px] text-amber-300 font-mono max-h-24 overflow-y-auto hidden">
            <b>گزارش سیستم:</b> <span id="debug-log">شروع فرآیند...</span>
        </div>
    </div>

    <!-- دکمه‌های کنترل پایین صفحه -->
    <div class="absolute bottom-6 right-4 z-20 flex flex-col gap-2">
        <button onclick="centerMap()" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 rounded-2xl flex items-center justify-center text-white shadow-xl border border-white/10 font-bold">
            📍
        </button>
    </div>

    <script>
        const SUPABASE_URL = 'https://dxdskvkcmovotzxixxhd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3-rNuWmg9jAyPPQ89hE4ZQ_avo0wsPd';
        let supabaseClient = null;
        let map = null, myMarker = null, otherMarkersGroup = null;

        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();
        const tgUser = tg?.initDataUnsafe?.user;

        const currentUser = {
            id: tgUser ? String(tgUser.id) : String(Math.floor(Math.random() * 900000) + 100000),
            name: tgUser ? `${tgUser.first_name || ''} ${tgUser.last_name || ''}`.trim() : "تستی " + Math.floor(Math.random()*100),
            username: tgUser?.username || 'user_' + Math.floor(Math.random()*1000),
            avatar_url: tgUser?.photo_url || '',
            lat: 35.6892 + (Math.random() - 0.5) * 0.01,
            lng: 51.3890 + (Math.random() - 0.5) * 0.01
        };

        function logDebug(msg) {
            console.log(msg);
            const box = document.getElementById('debug-box');
            const logEl = document.getElementById('debug-log');
            box.classList.remove('hidden');
            logEl.textContent = msg;
        }

        window.addEventListener('DOMContentLoaded', () => {
            try {
                logDebug("در حال راه‌اندازی نقشه...");
                
                // مقداردهی اولیه نقشه
                map = L.map('map', { zoomControl: false }).setView([currentUser.lat, currentUser.lng], 15);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
                otherMarkersGroup = L.layerGroup().addTo(map);

                // تنظیم اطلاعات ظاهری کاربر
                document.getElementById('my-name').textContent = currentUser.name;
                const av = document.getElementById('my-avatar');
                if(currentUser.avatar_url) av.innerHTML = `<img src="${currentUser.avatar_url}" class="w-full h-full object-cover">`;
                else av.textContent = currentUser.name.charAt(0);

                // ایجاد نشانگر من
                updateMyMarker();

                // اتصال به ساب‌پیس
                if (window.supabase) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    logDebug("اتصال به Supabase موفقیت‌آمیز بود.");
                    manualSync();
                    setupRealtime();
                } else {
                    logDebug("خطا: کتابخانه Supabase بارگذاری نشد!");
                }

                // گرفتن موقعیت واقعی دستگاه در صورت اجازه
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        pos => {
                            currentUser.lat = pos.coords.latitude;
                            currentUser.lng = pos.coords.longitude;
                            updateMyMarker();
                            map.setView([currentUser.lat, currentUser.lng], 16);
                            manualSync();
                            logDebug("موقعیت GPS با موفقیت دریافت شد.");
                        },
                        err => {
                            logDebug("هشدار GPS: دسترسی به موقعیت مکانی داده نشد، از موقعیت پیش‌فرض استفاده می‌شود.");
                        },
                        { timeout: 8000 }
                    );
                }

            } catch (e) {
                logDebug("خطای بحرانی در اجرا: " + e.message);
            }
        });

        function updateMyMarker() {
            if(!map) return;
            if(myMarker) map.removeLayer(myMarker);
            const icon = L.divIcon({ html: '<div class="my-pin"></div>', iconSize: [24, 24], iconAnchor: [12, 12] });
            myMarker = L.marker([currentUser.lat, currentUser.lng], { icon: icon }).addTo(map);
        }

        function centerMap() {
            if(map) map.setView([currentUser.lat, currentUser.lng], 16);
        }

        async function manualSync() {
            if (!supabaseClient) return;
            try {
                document.getElementById('status-text').textContent = 'در حال ارسال به سرور...';
                
                const { error } = await supabaseClient.from('users').upsert({
                    id: currentUser.id,
                    name: currentUser.name,
                    username: currentUser.username,
                    avatar_url: currentUser.avatar_url,
                    lat: currentUser.lat,
                    lng: currentUser.lng,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'id' });

                if (error) {
                    logDebug("خطا در ثبت پایگاه داده: " + error.message);
                    document.getElementById('status-text').textContent = 'خطا در ثبت!';
                } else {
                    document.getElementById('status-text').textContent = '🟢 آنلاین و متصل';
                    fetchAllUsers();
                }
            } catch (err) {
                logDebug("خطای ارتباطی: " + err.message);
            }
        }

        async function fetchAllUsers() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient.from('users').select('*');
                if (error) {
                    logDebug("خطا در خواندن کاربران: " + error.message);
                    return;
                }
                if (data) {
                    renderOtherUsers(data);
                }
            } catch (err) {
                logDebug("خطا در دریافت لیست: " + err.message);
            }
        }

        function setupRealtime() {
            if (!supabaseClient) return;
            supabaseClient
                .channel('public:users')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, payload => {
                    logDebug("تغییرات زنده دریافت شد!");
                    fetchAllUsers();
                })
                .subscribe();
        }

        function renderOtherUsers(users) {
            if(!otherMarkersGroup) return;
            otherMarkersGroup.clearLayers();

            users.forEach(user => {
                if (String(user.id) === String(currentUser.id)) return; // خودم را روی نقشه دیگران تکرار نکن
                if (!user.lat || !user.lng) return;

                const initial = user.name ? user.name.charAt(0) : 'ک';
                const avHtml = user.avatar_url ? `<img src="${user.avatar_url}" class="w-full h-full object-cover">` : initial;
                
                const icon = L.divIcon({
                    html: `<div class="other-pin">${avHtml}</div>`,
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });

                const marker = L.marker([user.lat, user.lng], { icon: icon });
                marker.bindPopup(`<div style="direction:rtl; font-family:Vazirmatn;"><b>${user.name}</b><br><span style="font-size:10px; color:gray;">@${user.username}</span></div>`);
                otherMarkersGroup.addLayer(marker);
            });
        }
    </script>
</body>
</html>
