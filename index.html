<!DOCTYPE html>
<html lang="fa" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تست نشانگر لوکیشن</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0e1621; color: #fff; font-family: 'Vazirmatn', sans-serif; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .dark-map .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }
    </style>
</head>
<body class="relative flex flex-col h-full justify-between select-none">

    <!-- نقشه -->
    <div id="map" class="dark-map"></div>

    <!-- کادر وضعیت و تست (برای عیب‌یابی راحت‌تر) -->
    <div class="absolute top-4 left-4 right-4 z-20 flex flex-col gap-2">
        <div id="status-box" class="bg-slate-900/90 border border-slate-700 p-3 rounded-2xl text-xs text-blue-400 shadow-xl backdrop-blur-md flex items-center justify-between">
            <span id="status-text">⏳ در حال دریافت موقعیت GPS...</span>
            <button onclick="retryLocation()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-xl text-[11px] font-bold">تلاش مجدد</button>
        </div>
    </div>

    <!-- دکمه مرکزیت روی لوکیشن -->
    <div class="absolute bottom-6 right-6 z-20">
        <button onclick="centerToMyLocation()" class="w-14 h-14 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl flex items-center justify-center shadow-2xl transition transform active:scale-95" title="موقعیت من">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </button>
    </div>

    <script>
        let map, myMarker = null, radiusCircle = null;
        let currentCoords = { lat: 35.6892, lng: 51.3890 }; // پیش‌فرض تهران
        let activeRadiusKm = 5; // شعاع ۵ کیلومتر

        window.addEventListener('DOMContentLoaded', () => {
            // ۱. راه‌اندازی اولیه نقشه
            map = L.map('map', { zoomControl: false }).setView([currentCoords.lat, currentCoords.lng], 15);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

            // رندر کردن مارکر اولیه با مختصات پیش‌فرض
            updateMapElements();

            // ۲. درخواست گرفتن لوکیشن واقعی از دستگاه
            requestDeviceLocation();
        });

        function requestDeviceLocation() {
            const statusText = document.getElementById('status-text');
            if (!navigator.geolocation) {
                statusText.textContent = "❌ مرورگر شما از Geolocation پشتیبانی نمی‌کند.";
                statusText.className = "text-xs text-red-400";
                return;
            }

            statusText.textContent = "📍 در حال دریافت موقعیت دقیق شما...";
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentCoords.lat = position.coords.latitude;
                    currentCoords.lng = position.coords.longitude;
                    
                    statusText.textContent = `✅ لوکیشن با موفقیت دریافت شد (${currentCoords.lat.toFixed(4)}, ${currentCoords.lng.toFixed(4)})`;
                    statusText.className = "text-xs text-emerald-400";

                    // به‌روزرسانی نقشه و مرکزیت روی کاربر
                    if(map) {
                        map.setView([currentCoords.lat, currentCoords.lng], 16, { animate: true });
                        updateMapElements();
                    }
                },
                (error) => {
                    console.warn("Geolocation error code:", error.code, error.message);
                    if (error.code === error.PERMISSION_DENIED) {
                        statusText.textContent = "⚠️ دسترسی به لوکیشن توسط کاربر رد شد.";
                    } else {
                        statusText.textContent = "⚠️ دریافت GPS ناموفق بود (استفاده از مختصات پیش‌فرض).";
                    }
                    statusText.className = "text-xs text-amber-400";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function retryLocation() {
            requestDeviceLocation();
        }

        function centerToMyLocation() {
            if(map) {
                map.setView([currentCoords.lat, currentCoords.lng], 16, { animate: true });
            }
        }

        function updateMapElements() {
            if(!map) return;

            // حذف دایره و مارکر قبلی اگر وجود داشت
            if(radiusCircle) map.removeLayer(radiusCircle);
            if(myMarker) map.removeLayer(myMarker);

            // ترسیم دایره شعاع
            radiusCircle = L.circle([currentCoords.lat, currentCoords.lng], {
                radius: activeRadiusKm * 1000,
                color: '#3b82f6',
                weight: 2,
                fillColor: '#3b82f6',
                fillOpacity: 0.1
            }).addTo(map);

            // ساخت نشانگر (پین) لوکیشن من در مرکز دایره
            const pinHtml = `
                <div style="width: 44px; height: 44px; border-radius: 50%; background: #2563eb; border: 3px solid #ffffff; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 16px; box-shadow: 0 4px 16px rgba(37, 99, 235, 0.8);">
                    📍
                </div>
            `;
            const customIcon = L.divIcon({ 
                html: pinHtml, 
                iconSize: [44, 44], 
                iconAnchor: [22, 22], 
                className: 'my-custom-pin' 
            });

            myMarker = L.marker([currentCoords.lat, currentCoords.lng], { icon: customIcon, zIndexOffset: 1000 }).addTo(map);
        }
    </script>
</body>
</html>
