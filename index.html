<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar CyberX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --tg-theme-bg-color: #0e1621;
            --tg-theme-text-color: #ffffff;
            --tg-theme-hint-color: #708499;
            --tg-bg-glass: rgba(17, 27, 43, 0.94);
            --tg-border-glass: rgba(255, 255, 255, 0.08);
            --accent-blue: #3390ec;
            --accent-online: #4bb34b;
        }
        body { margin: 0; padding: 0; background-color: var(--tg-theme-bg-color); font-family: sans-serif; color: var(--tg-theme-text-color); overflow: hidden; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) !important; }
        
        .telegram-search-bar {
            position: absolute; top: 14px; left: 14px; right: 14px; z-index: 1007;
            background: var(--tg-bg-glass); backdrop-filter: blur(20px);
            border: 1px solid var(--tg-border-glass); border-radius: 20px;
            padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;
        }
        .app-view-panel {
            position: absolute; top: 0; left: 0; right: 0; bottom: 60px;
            z-index: 1005; background: var(--tg-theme-bg-color); overflow-y: auto; display: none; padding: 16px; box-sizing: border-box;
        }
        .app-view-panel.active { display: block; }
        .nearby-user-card {
            background: var(--tg-bg-glass); border: 1px solid var(--tg-border-glass);
            border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 10px; cursor: pointer;
        }
        .telegram-tabbar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 1010;
            background: var(--tg-bg-glass); backdrop-filter: blur(20px);
            border-top: 1px solid var(--tg-border-glass);
            display: flex; justify-content: space-around; align-items: center; height: 60px;
        }
        .tab-item { text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--tg-theme-hint-color); font-size: 10px; width: 100%; height: 100%; }
        .tab-item.active { color: var(--accent-blue); }
        .tab-item i { font-size: 18px; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="telegram-search-bar">
        <span>شعاع جستجو: ۲۰ کیلومتر</span>
        <span id="my-name-display" style="color: var(--accent-blue);">کاربر</span>
    </div>

    <!-- پنل لیست افراد آنلاین -->
    <div id="people-view" class="app-view-panel">
        <h3 style="font-size: 16px; margin: 5px 0 14px 0;">افراد وارد شده و آنلاین</h3>
        <div id="nearby-users-list">
            <div style="color: var(--tg-theme-hint-color); text-align: center; margin-top: 40px;">در حال جستجوی کاربران...</div>
        </div>
    </div>

    <!-- منوی پایین صفحه -->
    <nav class="telegram-tabbar">
        <a href="#" class="tab-item active" data-target="map-view"><i class="fas fa-map"></i><span>نقشه</span></a>
        <a href="#" class="tab-item" data-target="people-view"><i class="fas fa-users"></i><span>افراد</span></a>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let myId = 'user_' + Math.random().toString(36).substring(2, 9);
        let myName = "کاربر تستی";
        let myUsername = "@TestUser";
        let searchRadius = 20;
        let otherMarkers = {};

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            myId = user.id;
            myName = user.first_name || "کاربر";
            if (user.username) myUsername = "@" + user.username;
        }
        document.getElementById('my-name-display').innerText = myName;

        const map = L.map('map', { zoomControl: false }).setView([35.6892, 51.3890], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let userLatLng = [35.6892 + (Math.random() - 0.5) * 0.01, 51.3890 + (Math.random() - 0.5) * 0.01];

        function syncLocation() {
            fetch('/api/update_location', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: myId, name: myName, username: myUsername, lat: userLatLng[0], lng: userLatLng[1], stealth_mode: false })
            })
            .then(res => res.json())
            .then(data => { if (data.users) updateUI(data.users); })
            .catch(err => console.log(err));
        }

        function updateUI(users) {
            let listContainer = document.getElementById('nearby-users-list');
            listContainer.innerHTML = '';

            let filtered = users.filter(u => u.distance <= searchRadius);

            filtered.forEach(u => {
                // به‌روزرسانی یا ایجاد مارکر روی نقشه
                if (otherMarkers[u.user_id]) {
                    otherMarkers[u.user_id].setLatLng([u.lat, u.lng]);
                } else {
                    let marker = L.marker([u.lat, u.lng], {
                        icon: L.divIcon({ html: `<div style="background: #ff4757; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff;"></div>` })
                    }).addTo(map);
                    otherMarkers[u.user_id] = marker;
                }

                // افزودن به لیست افراد در تب «افراد»
                let card = document.createElement('div');
                card.className = 'nearby-user-card';
                card.innerHTML = `
                    <div>
                        <h4 style="margin: 0 0 4px 0; font-size: 14px; color: #fff;">${u.name}</h4>
                        <span style="font-size: 11px; color: var(--accent-blue);">${u.distance} کیلومتر فاصله</span>
                    </div>
                    <a href="https://t.me/${u.username.replace('@','')}" target="_blank" style="background: var(--accent-blue); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 11px; text-decoration: none;">ارتباط</a>
                `;
                listContainer.appendChild(card);
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div style="color: var(--tg-theme-hint-color); text-align: center; margin-top: 40px;">کاربر دیگری آنلاین نیست.</div>`;
            }
        }

        L.marker(userLatLng, { icon: L.divIcon({ html: '<div style="background: var(--accent-blue); width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff;"></div>' }) }).addTo(map);
        syncLocation();
        setInterval(syncLocation, 3000);

        // مدیریت تب‌ها
        document.querySelectorAll('.tab-item').forEach(tab => {
            tab.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                let target = tab.getAttribute('data-target');
                document.querySelectorAll('.app-view-panel').forEach(v => v.classList.remove('active'));
                if (target === 'people-view') document.getElementById('people-view').classList.add('active');
            });
        });
    </script>
</body>
</html>
