<!DOCTYPE html>
<html lang="fa" class="h-full">
<head>
    <meta charset="UTF-8">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');
        body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0e1621; color: #f5f5f5; font-family: 'Vazirmatn', sans-serif; }
        .map-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .glass-box {
            background: rgba(23, 33, 43, 0.45);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* نشانگر موقعیت مکانی من با سایه متحرک بازشونده (Pulse) */
        .my-animated-marker {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(66, 133, 244, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: google-radar-pulse 2.2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        .my-marker-inner {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            overflow: hidden;
            background: #4285f4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.6);
        }
        @keyframes google-radar-pulse {
            0% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(66, 133, 244, 0.6), 0 0 0 0 rgba(66, 133, 244, 0.4); }
            50% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(66, 133, 244, 0), 0 0 0 35px rgba(66, 133, 244, 0.15); }
            100% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(66, 133, 244, 0), 0 0 0 0 rgba(66, 133, 244, 0); }
        }

        .leaflet-container { background-color: #0e1621 !important; }
        .transparent-location-btn {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
        .transparent-location-btn:hover { background: rgba(255, 255, 255, 0.08) !important; }

        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body class="relative flex flex-col h-full justify-between select-none">

    <!-- نقشه زنده من -->
    <div class="relative w-full h-full">
        <div id="map" class="map-container"></div>
        
        <!-- کادر بالای صفحه -->
        <div class="absolute top-3 left-3 right-3 z-10 pointer-events-none">
            <div class="glass-box px-3 py-2 rounded-2xl flex items-center justify-between gap-2 shadow-2xl pointer-events-auto">
                <span class="text-[11px] font-bold text-blue-400">نقشه اختصاصی من</span>
                <div class="flex items-center gap-1.5">
                    <span id="top-my-name" class="font-bold text-xs text-white truncate max-w-[100px]">کاربر</span>
                    <div id="top-my-avatar" class="w-7 h-7 rounded-full bg-[#2b5278] flex items-center justify-center font-bold text-white text-xs overflow-hidden shadow">ک</div>
                </div>
            </div>
        </div>

        <!-- دکمه مرکزیت لوکیشن من -->
        <div class="absolute bottom-6 right-4 z-10 pointer-events-auto">
            <button onclick="centerToMyLocation()" class="w-12 h-12 transparent-location-btn rounded-2xl flex items-center justify-center text-white transition hover:scale-105 active:scale-95" title="موقعیت من">
                <svg class="w-7 h-7 text-blue-400 drop-shadow-md" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://dxdskvkcmovotzxixxhd.supabase.co";
        const SUPABASE_KEY = "sb_publishable_3-rNuWmg9jAyPPQ89hE4ZQ_avo0wsPd";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        let map, myLocationMarker = null, radiusCircle = null;
        let currentCoords = { lat: 35.6892, lng: 51.3890 };
        const activeRadiusKm = 15;

        const user = tg?.initDataUnsafe?.user || { 
            id: Math.floor(Math.random() * 900000) + 100000, 
            first_name: "کاربر " + Math.floor(Math.random() * 100), 
            username: "user_" + Math.random().toString(36).substring(7) 
        };
        let currentUser = { telegram_id: user.id, name: user.first_name };

        window.addEventListener('DOMContentLoaded', async () => {
            map = L.map('map', { zoomControl: false }).setView([currentCoords.lat, currentCoords.lng], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    currentCoords.lat = position.coords.latitude;
                    currentCoords.lng = position.coords.longitude;
                    if(map) map.setView([currentCoords.lat, currentCoords.lng], 15, { animate: true });
                    updateRadiusCircleOnMap();
                }, () => {
                    updateRadiusCircleOnMap();
                }, { enableHighAccuracy: true, timeout: 5000 });
            } else {
                updateRadiusCircleOnMap();
            }

            document.getElementById('top-my-name').textContent = currentUser.name;
        });

        function centerToMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    currentCoords.lat = position.coords.latitude;
                    currentCoords.lng = position.coords.longitude;
                    if(map) map.setView([currentCoords.lat, currentCoords.lng], 15, { animate: true });
                    updateRadiusCircleOnMap();
                }, () => {}, { enableHighAccuracy: true, timeout: 5000 });
            }
        }

        function updateRadiusCircleOnMap() {
            if(!map) return;
            if(radiusCircle) map.removeLayer(radiusCircle);
            radiusCircle = L.circle([currentCoords.lat, currentCoords.lng], {
                radius: activeRadiusKm * 1000,
                color: '#4285f4',
                weight: 1.5,
                fillColor: '#4285f4',
                fillOpacity: 0.08
            }).addTo(map);

            if(myLocationMarker) map.removeLayer(myLocationMarker);
            const initial = (currentUser?.name || 'ک').charAt(0);
            const myHtml = `<div class="my-animated-marker"><div class="my-marker-inner"><span>${initial}</span></div></div>`;
            const myIcon = L.divIcon({ html: myHtml, iconSize: [64, 64], iconAnchor: [32, 32] });
            myLocationMarker = L.marker([currentCoords.lat, currentCoords.lng], { icon }).addTo(map);
        }
    </script>
</body>
</html>
