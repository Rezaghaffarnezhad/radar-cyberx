<!DOCTYPE html>
<html lang="fa" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Social Map</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0d1117; color: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .glass { background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(240, 246, 252, 0.1); }
        .custom-marker { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 2px solid #3b82f6; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.6); background: #1e293b; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .status-dot { position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #0d1117; background: #22c55e; }
        .leaflet-layer { filter: invert(100%) hue-rotate(180deg) brightness(90%) contrast(90%); }
        .leaflet-container { background-color: #0d1117 !important; }
    </style>
</head>
<body class="relative flex flex-col h-full">

    <div id="map"></div>

    <div class="absolute top-4 left-4 right-4 z-10 glass p-3 rounded-2xl flex items-center justify-between shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
            <span class="text-sm font-semibold tracking-wide">نقشه زنده اجتماعی</span>
        </div>
        <span id="online-count" class="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-300">در حال اتصال...</span>
    </div>

    <div id="profile-modal" class="hidden absolute bottom-0 left-0 right-0 glass p-6 rounded-t-3xl z-50 flex flex-col gap-4 shadow-2xl transition-all">
        <div class="flex items-center gap-4">
            <div id="modal-avatar" class="w-16 h-16 rounded-full bg-blue-600 flex items-center justify-center text-xl font-bold text-white shadow-md">ک</div>
            <div>
                <h3 id="modal-name" class="font-bold text-lg">نام کاربر</h3>
                <p class="text-xs text-green-400 flex items-center gap-1 mt-0.5">● آنلاین در نزدیکی شما</p>
            </div>
            <button onclick="closeProfile()" class="ml-auto text-slate-400 hover:text-white text-xl p-2">✕</button>
        </div>
        <button onclick="openChat()" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl font-semibold shadow-lg hover:opacity-95 transition">شروع گفتگوی زنده</button>
    </div>

    <div id="chat-window" class="hidden absolute inset-0 bg-[#0d1117] z-50 flex flex-col">
        <div class="p-4 glass flex items-center gap-3 border-b border-slate-800">
            <button onclick="closeChat()" class="text-slate-300 text-xl px-2">←</button>
            <h3 id="chat-title" class="font-bold text-base">چت خصوصی</h3>
        </div>
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3"></div>
        <div class="p-4 glass flex gap-2 border-t border-slate-800">
            <input id="chat-input" type="text" placeholder="نوشتن پیام..." class="flex-1 bg-slate-900/80 px-4 py-3 rounded-2xl outline-none border border-slate-800 text-sm text-white focus:border-blue-500 transition">
            <button onclick="sendMessage()" class="bg-blue-600 px-6 rounded-2xl font-semibold text-sm shadow-md hover:bg-blue-500 transition">ارسال</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://dxdskvkcmovotzxixxhd.supabase.co";
        const SUPABASE_KEY = "sb_publishable_3-rNuWmg9jAyPPQ89hE4ZQ_avo0wsPd";
        const TELEGRAM_BOT_TOKEN = "8186173027:AAHY6oTA7TF0NWbgD_KaajJgqBZtyAu6EPc";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let tg = window.Telegram?.WebApp;
        let currentUser = null, selectedTargetUser = null;
        let map, markers = {};

        const user = tg?.initDataUnsafe?.user || { id: Math.floor(Math.random()*100000), first_name: "کاربر تستی", username: "test_user" };

        async function init() {
            const { data } = await supabaseClient
                .from('users')
                .upsert({ telegram_id: user.id, name: user.first_name, username: user.username, last_seen: new Date() }, { onConflict: 'telegram_id' })
                .select()
                .single();

            if (data) currentUser = data;

            map = L.map('map', { zoomControl: false }).setView([35.6892, 51.3890], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(async pos => {
                    if (!currentUser) return;
                    await supabaseClient.from('users').update({ 
                        latitude: pos.coords.latitude, 
                        longitude: pos.coords.longitude, 
                        last_seen: new Date() 
                    }).eq('telegram_id', currentUser.telegram_id);
                }, err => console.log(err), { enableHighAccuracy: true });
            }

            setInterval(fetchNearbyUsers, 4000);
            fetchNearbyUsers();
        }

        async function fetchNearbyUsers() {
            const { data } = await supabaseClient.from('users').select('*');
            if (data) {
                document.getElementById('online-count').textContent = `${data.length} نفر آنلاین`;
                data.forEach(u => {
                    if (u.telegram_id === currentUser?.telegram_id || !u.latitude || !u.longitude) return;
                    const initial = u.name ? u.name.charAt(0) : '?';
                    const html = `<div class="custom-marker">${initial}<div class="status-dot"></div></div>`;
                    const icon = L.divIcon({ html, iconSize: [44, 44], iconAnchor: [22, 22] });

                    if (markers[u.telegram_id]) {
                        markers[u.telegram_id].setLatLng([u.latitude, u.longitude]);
                    } else {
                        const marker = L.marker([u.latitude, u.longitude], { icon }).addTo(map);
                        marker.on('click', () => showProfile(u));
                        markers[u.telegram_id] = marker;
                    }
                });
            }
        }

        function showProfile(u) {
            selectedTargetUser = u;
            document.getElementById('modal-name').textContent = u.name;
            document.getElementById('modal-avatar').textContent = u.name.charAt(0);
            document.getElementById('profile-modal').classList.remove('hidden');
        }

        function closeProfile() { document.getElementById('profile-modal').classList.add('hidden'); }
        function openChat() { closeProfile(); document.getElementById('chat-title').textContent = selectedTargetUser.name; document.getElementById('chat-window').classList.remove('hidden'); loadMessages(); }
        function closeChat() { document.getElementById('chat-window').classList.add('hidden'); }

        async function loadMessages() {
            if (!selectedTargetUser) return;
            const { data } = await supabaseClient.from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.telegram_id},receiver_id.eq.${selectedTargetUser.telegram_id}),and(sender_id.eq.${selectedTargetUser.telegram_id},receiver_id.eq.${currentUser.telegram_id})`)
                .order('created_at', { ascending: true });

            const container = document.getElementById('chat-messages');
            container.innerHTML = (data || []).map(m => `
                <div class="max-w-[75%] p-3.5 rounded-2xl text-sm ${m.sender_id === currentUser.telegram_id ? 'bg-blue-600 self-end rounded-br-none' : 'bg-slate-800 self-start rounded-bl-none'}">
                    ${m.message}
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message || !selectedTargetUser) return;

            await supabaseClient.from('messages').insert([{ 
                sender_id: currentUser.telegram_id, 
                receiver_id: selectedTargetUser.telegram_id, 
                message 
            }]);

            input.value = '';
            loadMessages();
        }

        init();
    </script>
</body>
</html>
