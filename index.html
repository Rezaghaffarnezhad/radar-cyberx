<!DOCTYPE html>
<html lang="fa" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تلسکوپ - رادار و پیام‌رسان آنی سراسری</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');
        body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0e1621; color: #f5f5f5; font-family: 'Vazirmatn', sans-serif; }
        .map-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .glass-box {
            background: rgba(23, 33, 43, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tg-card { background: #17212b; border: 1px solid rgba(255,255,255,0.04); }
        .leaflet-container { background-color: #0e1621 !important; }
        .dark-map .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }

        .animated-my-pin {
            width: 26px !important;
            height: 26px !important;
            background-color: #3b82f6 !important;
            border: 3px solid #ffffff !important;
            border-radius: 50% !important;
            box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.8);
            animation: pulse-shadow 2s infinite ease-out;
            margin-top: -13px !important;
            margin-left: -13px !important;
            z-index: 1000 !important;
        }

        @keyframes pulse-shadow {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.8); }
            70% { box-shadow: 0 0 0 18px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        .other-user-pin {
            width: 42px !important;
            height: 42px !important;
            border-radius: 50%;
            background: #1e293b;
            border: 2.5px solid #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 13px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            position: relative;
        }

        .online-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border: 2px solid #1e293b;
            border-radius: 50%;
        }

        .msg-bubble-out { background-color: #2b5278; color: #ffffff; border-radius: 16px 16px 4px 16px; }
        .msg-bubble-in { background-color: #18222d; color: #ffffff; border-radius: 16px 16px 16px 4px; border: 1px solid rgba(255,255,255,0.04); }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    </style>
</head>
<body class="relative flex flex-col h-full justify-between select-none">

    <div class="relative w-full h-full">
        <div id="map" class="map-container dark-map"></div>
        
        <!-- هدر بالای صفحه -->
        <div class="absolute top-3 left-3 right-3 z-10 pointer-events-none">
            <div class="glass-box px-3 py-2 rounded-2xl flex items-center justify-between gap-2 shadow-2xl pointer-events-auto">
                <div class="flex items-center gap-2">
                    <span class="text-[11px] font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1.5 rounded-xl">⚡ رادار و پیام‌رسان سراسری</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="flex items-center gap-1.5">
                        <span id="top-my-name" class="font-bold text-xs text-white truncate max-w-[100px]">کاربر</span>
                        <div id="top-my-avatar" class="w-8 h-8 rounded-full bg-[#2b5278] flex items-center justify-center font-bold text-white text-xs overflow-hidden shadow">ک</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- دکمه‌های کنترل سمت راست -->
        <div class="absolute bottom-6 right-4 z-10 flex flex-col gap-2 pointer-events-auto">
            <button onclick="openChatModal('public', null, 'چت عمومی')" class="w-12 h-12 bg-slate-800/85 hover:bg-slate-700 rounded-2xl flex items-center justify-center text-white transition hover:scale-105 active:scale-95 shadow-xl border border-white/10 relative" title="چت عمومی">
                <svg class="w-6 h-6 text-sky-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
            </button>
            <button onclick="openUsersListModal()" class="w-12 h-12 bg-slate-800/85 hover:bg-slate-700 rounded-2xl flex items-center justify-center text-white transition hover:scale-105 active:scale-95 shadow-xl border border-white/10 relative" title="لیست افراد آنلاین">
                <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                <span id="online-count-badge" class="absolute -top-1 -right-1 bg-emerald-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">0</span>
            </button>
            <button onclick="centerToMyLocation()" class="w-12 h-12 bg-slate-800/85 hover:bg-slate-700 rounded-2xl flex items-center justify-center text-white transition hover:scale-105 active:scale-95 shadow-xl border border-white/10" title="موقعیت من">
                <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
        </div>
    </div>

    <!-- مودال لیست افراد آنلاین -->
    <div id="users-list-modal" class="hidden absolute inset-0 bg-black/80 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="closeUsersListModal()">
        <div class="tg-card w-full max-w-md max-h-[85vh] rounded-t-3xl sm:rounded-2xl p-5 flex flex-col gap-3 shadow-2xl border border-slate-700 overflow-hidden" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                <h3 class="font-bold text-sm text-white flex items-center gap-2">🟢 اسامی افراد آنلاین در سیستم</h3>
                <button onclick="closeUsersListModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>
            
            <div class="relative w-full">
                <input type="text" id="user-search-input" oninput="filterUsersList(this.value)" placeholder="جستجو بر اساس نام یا یوزرنیم (@)..." class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 px-3 pr-9 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-blue-500">
                <svg class="w-4 h-4 text-slate-400 absolute right-3 top-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>

            <div id="users-scroll-container" class="flex flex-col gap-2 overflow-y-auto max-h-[45vh] pr-1">
                <div class="text-center text-xs text-slate-400 py-6">در حال بارگذاری لیست...</div>
            </div>

            <button onclick="closeUsersListModal()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 rounded-xl font-medium text-xs text-white transition mt-1">بستن</button>
        </div>
    </div>

    <!-- مودال چت تلگرامی پیشرفته و آنی -->
    <div id="chat-modal" class="hidden absolute inset-0 bg-black/80 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="closeChatModalUI()">
        <div class="tg-card w-full max-w-md h-[90vh] sm:h-[80vh] rounded-t-3xl sm:rounded-2xl flex flex-col shadow-2xl border border-slate-700 overflow-hidden" onclick="event.stopPropagation()">
            <!-- هدر چت تلگرام -->
            <div class="px-4 py-3 bg-[#17212b] border-b border-slate-700/60 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div id="chat-header-avatar" class="w-10 h-10 rounded-full bg-sky-600 flex items-center justify-center font-bold text-white text-sm overflow-hidden shadow">💬</div>
                    <div class="flex flex-col">
                        <span id="chat-title" class="font-bold text-xs text-white">چت عمومی</span>
                        <span id="chat-subtitle" class="text-[10px] text-emerald-400">آنلاین</span>
                    </div>
                </div>
                <button onclick="closeChatModalUI()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>

            <!-- بدنه پیام‌ها -->
            <div id="chat-messages-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2 bg-[#0e1621]">
                <div class="text-center text-xs text-slate-500 py-4">بارگذاری پیام‌ها...</div>
            </div>

            <!-- باکس ریپلی یا ویرایش -->
            <div id="action-preview-box" class="hidden px-4 py-2 bg-[#17212b] border-t border-slate-700/50 flex items-center justify-between">
                <div class="flex flex-col border-r-2 border-blue-400 pr-2">
                    <span id="action-preview-title" class="text-[10px] text-blue-400 font-bold">پاسخ به ...</span>
                    <span id="action-preview-text" class="text-[11px] text-slate-300 truncate max-w-[280px]">متن پیام...</span>
                </div>
                <button onclick="cancelActionState()" class="text-slate-400 hover:text-white text-xs px-2">✕</button>
            </div>

            <!-- فرم ارسال پیام تلگرامی -->
            <div class="p-3 bg-[#17212b] border-t border-slate-700/60 flex items-center gap-2">
                <input type="text" id="chat-input" placeholder="پیام..." oninput="handleTypingEvent()" onkeydown="if(event.key==='Enter') handleSendOrEditMessage()" class="flex-1 bg-[#212f3d] border border-transparent focus:border-blue-500 rounded-xl py-2.5 px-4 text-xs text-white placeholder-slate-400 focus:outline-none">
                <button onclick="handleSendOrEditMessage()" class="w-10 h-10 bg-blue-600 hover:bg-blue-500 text-white rounded-xl flex items-center justify-center transition shadow shrink-0">
                    <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dxdskvkcmovotzxixxhd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3-rNuWmg9jAyPPQ89hE4ZQ_avo0wsPd';
        let supabaseClient = null;
        
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) { console.error("Supabase init error:", e); }

        let tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        let map = null, myLocationMarker = null, radiusCircle = null;
        let markersLayerGroup = L.layerGroup(); 
        let onlineUsersMap = new Map(); 
        let onlineUsersList = []; 
        let currentCoords = { lat: 35.6892, lng: 51.3890 }; 
        let activeRadiusKm = 15;
        let isFirstCenter = true;
        let radarChannel = null;
        let chatRealtimeChannel = null;

        let currentChatType = 'public';
        let currentReceiverId = null;
        let replyingToMessage = null;
        let editingMessageId = null;
        let activeMessagesArray = [];
        let isTypingSent = false;

        const tgUser = tg?.initDataUnsafe?.user;
        let currentUser = { 
            id: tgUser ? String(tgUser.id) : String(Math.floor(Math.random() * 900000) + 100000),
            name: tgUser ? `${tgUser.first_name || ''} ${tgUser.last_name || ''}`.trim() : "کاربر تستی (" + Math.floor(Math.random()*100) + ")",
            username: tgUser?.username || 'user_' + Math.floor(Math.random()*1000),
            avatar_url: tgUser?.photo_url || ''
        };

        window.addEventListener('DOMContentLoaded', () => {
            try {
                map = L.map('map', { zoomControl: false }).setView([currentCoords.lat, currentCoords.lng], 15);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }).addTo(map);
                
                markersLayerGroup.addTo(map);
                setupUserUI();
                updateMapElements();

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            currentCoords.lat = position.coords.latitude;
                            currentCoords.lng = position.coords.longitude;
                            if(map && isFirstCenter) {
                                map.setView([currentCoords.lat, currentCoords.lng], 16, { animate: true });
                                isFirstCenter = false;
                            }
                            updateMapElements();
                            initPresenceChannel();
                        },
                        () => { initPresenceChannel(); },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                } else {
                    initPresenceChannel();
                }

                initGlobalMessagesRealtime();
            } catch (err) { console.error("Initialization error:", err); }
        });

        function setupUserUI() {
            document.getElementById('top-my-name').textContent = currentUser.name;
            const avatarEl = document.getElementById('top-my-avatar');
            if(currentUser.avatar_url) {
                avatarEl.innerHTML = `<img src="${currentUser.avatar_url}" class="w-full h-full object-cover">`;
            } else {
                avatarEl.textContent = currentUser.name.charAt(0) || 'ک';
            }
        }

        function updateMapElements() {
            if(!map) return;
            if(radiusCircle) map.removeLayer(radiusCircle);
            if(myLocationMarker) map.removeLayer(myLocationMarker);

            radiusCircle = L.circle([currentCoords.lat, currentCoords.lng], {
                radius: activeRadiusKm * 1000,
                color: '#3b82f6',
                weight: 1.5,
                fillColor: '#3b82f6',
                fillOpacity: 0.08
            }).addTo(map);

            const customIcon = L.divIcon({ html: '<div class="animated-my-pin"></div>', iconSize: [26, 26], iconAnchor: [13, 13], className: '' });
            myLocationMarker = L.marker([currentCoords.lat, currentCoords.lng], { icon: customIcon, zIndexOffset: 1000 }).addTo(map);
        }

        function initPresenceChannel() {
            if (!supabaseClient) return;
            radarChannel = supabaseClient.channel('radar-online-users', { config: { presence: { key: currentUser.id } } });

            radarChannel
                .on('presence', { event: 'sync' }, () => { processPresenceState(radarChannel.presenceState()); })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await radarChannel.track({
                            id: currentUser.id, name: currentUser.name, username: currentUser.username,
                            avatar_url: currentUser.avatar_url, lat: currentCoords.lat, lng: currentCoords.lng, online_at: new Date().toISOString()
                        });
                    }
                });
        }

        function processPresenceState(state) {
            markersLayerGroup.clearLayers();
            onlineUsersList = [];
            onlineUsersMap.clear();

            let allActiveUsers = [];
            Object.keys(state).forEach(presenceId => {
                let userDatas = state[presenceId];
                if (userDatas && userDatas.length > 0) allActiveUsers.push(userDatas[0]);
            });

            onlineUsersMap.set(currentUser.id, { ...currentUser, online_at: new Date().toISOString(), isOnline: true });

            allActiveUsers.forEach(user => {
                const userIdStr = String(user.id);
                onlineUsersMap.set(userIdStr, { ...user, isOnline: true });
                if (userIdStr === String(currentUser.id) || !user.lat || !user.lng) return;

                const distanceKm = getDistanceFromLatLonInKm(currentCoords.lat, currentCoords.lng, user.lat, user.lng);
                onlineUsersList.push({ ...user, distance: distanceKm, isMe: false });

                const avatarHtml = user.avatar_url ? `<img src="${user.avatar_url}" class="w-full h-full object-cover">` : (user.name ? user.name.charAt(0) : 'ک');
                const pinHtml = `<div class="other-user-pin">${avatarHtml}<div class="online-dot"></div></div>`;
                const userIcon = L.divIcon({ html: pinHtml, iconSize: [42, 42], iconAnchor: [21, 21], className: '' });

                const marker = L.marker([user.lat, user.lng], { icon: userIcon });
                marker.bindPopup(`
                    <div style="direction: rtl; font-family: 'Vazirmatn'; text-align: right;">
                        <b style="color: #10b981;">${user.name || 'کاربر'} (آنلاین)</b><br>
                        <span style="font-size: 11px; color: #64748b;">@${user.username || 'بدون نام'}</span><br>
                        <span style="font-size: 11px; color: #10b981;">فاصله: ${distanceKm.toFixed(1)} کیلومتر</span><br>
                        <button onclick="openChatModal('private', '${user.id}', '${user.name}', '${user.avatar_url || ''}')" style="margin-top:6px; background:#2b5278; color:#fff; border:none; padding:4px 10px; border-radius:6px; font-size:11px; cursor:pointer;">💬 ارسال پیام</button>
                    </div>
                `);
                markersLayerGroup.addLayer(marker);
            });

            document.getElementById('online-count-badge').textContent = onlineUsersList.length + 1;
            if (currentChatType === 'private' && currentReceiverId) updateChatHeaderStatus(currentReceiverId);
            if (!document.getElementById('users-list-modal').classList.contains('hidden')) renderUsersList(onlineUsersList);
        }

        function openChatModal(type, receiverId, receiverName, receiverAvatar = '') {
            currentChatType = type;
            currentReceiverId = receiverId;
            cancelActionState();

            document.getElementById('chat-title').textContent = type === 'public' ? 'چت عمومی' : receiverName;
            const headerAvatar = document.getElementById('chat-header-avatar');
            
            if (type === 'public') {
                headerAvatar.innerHTML = '💬';
                document.getElementById('chat-subtitle').textContent = 'گفتگوی همگانی';
            } else {
                headerAvatar.innerHTML = receiverAvatar ? `<img src="${receiverAvatar}" class="w-full h-full object-cover">` : (receiverName ? receiverName.charAt(0) : '👤');
                updateChatHeaderStatus(receiverId);
                initChatBroadcastChannel(receiverId);
            }

            document.getElementById('users-list-modal').classList.add('hidden');
            document.getElementById('chat-modal').classList.remove('hidden');

            fetchMessages();
        }

        function initChatBroadcastChannel(receiverId) {
            if (!supabaseClient) return;
            if (chatRealtimeChannel) supabaseClient.removeChannel(chatRealtimeChannel);

            const roomName = `chat_${[currentUser.id, receiverId].sort().join('_')}`;
            chatRealtimeChannel = supabaseClient.channel(roomName, { config: { broadcast: { self: false } } });

            chatRealtimeChannel
                .on('broadcast', { event: 'typing' }, payload => {
                    if (String(payload.payload.sender_id) === String(currentReceiverId)) {
                        const subtitleEl = document.getElementById('chat-subtitle');
                        subtitleEl.textContent = 'در حال تایپ...';
                        subtitleEl.className = 'text-[10px] text-blue-400 font-bold animate-pulse';
                        
                        setTimeout(() => {
                            if (currentChatType === 'private') updateChatHeaderStatus(currentReceiverId);
                        }, 3000);
                    }
                })
                .subscribe();
        }

        function handleTypingEvent() {
            if (currentChatType === 'private' && chatRealtimeChannel) {
                if (!isTypingSent) {
                    isTypingSent = true;
                    chatRealtimeChannel.send({ type: 'broadcast', event: 'typing', payload: { sender_id: currentUser.id } });
                    setTimeout(() => { isTypingSent = false; }, 2000);
                }
            }
        }

        function updateChatHeaderStatus(receiverId) {
            const subtitleEl = document.getElementById('chat-subtitle');
            const targetUser = onlineUsersMap.get(String(receiverId));
            if (targetUser && targetUser.isOnline) {
                subtitleEl.textContent = 'آنلاین';
                subtitleEl.className = 'text-[10px] text-emerald-400 font-medium';
            } else {
                subtitleEl.textContent = targetUser && targetUser.online_at ? `آخرین بازدید: ${formatLastSeen(targetUser.online_at)}` : 'آفلاین';
                subtitleEl.className = 'text-[10px] text-slate-400';
            }
        }

        function formatLastSeen(isoString) {
            try { return new Date(isoString).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (e) { return 'اخیراً'; }
        }

        function closeChatModalUI() {
            document.getElementById('chat-modal').classList.add('hidden');
            if (chatRealtimeChannel) { supabaseClient.removeChannel(chatRealtimeChannel); chatRealtimeChannel = null; }
        }

        async function handleSendOrEditMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !supabaseClient) return;
            input.value = '';

            if (editingMessageId) {
                const msgId = editingMessageId;
                cancelActionState();
                await supabaseClient.from('messages').update({ message: text }).eq('id', msgId);
                return;
            }

            const replyData = replyingToMessage;
            cancelActionState();

            try {
                await supabaseClient.from('messages').insert({
                    sender_id: currentUser.id,
                    sender_name: currentUser.name,
                    sender_avatar: currentUser.avatar_url,
                    receiver_id: currentChatType === 'public' ? null : currentReceiverId,
                    message: text,
                    reply_to_name: replyData ? replyData.sender_name : null,
                    reply_to_text: replyData ? replyData.message : null
                });
            } catch (err) { console.error("Error sending message:", err); }
        }

        function setReplyTo(id, name, messageText) {
            editingMessageId = null;
            replyingToMessage = { id, sender_name: name, message: messageText };
            document.getElementById('action-preview-title').textContent = `پاسخ به ${name}`;
            document.getElementById('action-preview-text').textContent = messageText;
            document.getElementById('action-preview-box').classList.remove('hidden');
            document.getElementById('chat-input').focus();
        }

        function setEditMessage(id, currentText) {
            replyingToMessage = null;
            editingMessageId = id;
            document.getElementById('action-preview-title').textContent = 'ویرایش پیام';
            document.getElementById('action-preview-text').textContent = currentText;
            document.getElementById('action-preview-box').classList.remove('hidden');
            const input = document.getElementById('chat-input');
            input.value = currentText;
            input.focus();
        }

        function cancelActionState() {
            replyingToMessage = null;
            editingMessageId = null;
            document.getElementById('action-preview-box').classList.add('hidden');
        }

        async function deleteMessage(id) {
            await supabaseClient.from('messages').delete().eq('id', id);
        }

        async function fetchMessages() {
            if (!supabaseClient) return;
            try {
                let query = supabaseClient.from('messages').select('*').order('created_at', { ascending: true });
                if (currentChatType === 'public') {
                    query = query.is('receiver_id', null);
                } else {
                    query = query.or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentReceiverId}),and(sender_id.eq.${currentReceiverId},receiver_id.eq.${currentUser.id})`);
                }

                const { data, error } = await query;
                if (!error && data) {
                    activeMessagesArray = data;
                    renderMessages(activeMessagesArray);
                }
            } catch (err) { console.error("Error fetching messages:", err); }
        }

        function initGlobalMessagesRealtime() {
            if (!supabaseClient) return;
            supabaseClient
                .channel('public:messages')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, payload => {
                    const chatModal = document.getElementById('chat-modal');
                    if (chatModal.classList.contains('hidden')) return;

                    const newMsg = payload.new;
                    const oldMsg = payload.old;

                    const isRelevant = (msg) => {
                        if (!msg) return false;
                        if (currentChatType === 'public' && !msg.receiver_id) return true;
                        if (currentChatType === 'private' && (
                            (String(msg.sender_id) === String(currentUser.id) && String(msg.receiver_id) === String(currentReceiverId)) ||
                            (String(msg.sender_id) === String(currentReceiverId) && String(msg.receiver_id) === String(currentUser.id))
                        )) return true;
                        return false;
                    };

                    if (payload.eventType === 'INSERT' && isRelevant(newMsg)) {
                        if (!activeMessagesArray.some(m => m.id === newMsg.id)) {
                            activeMessagesArray.push(newMsg);
                            renderMessages(activeMessagesArray);
                        }
                    } else if (payload.eventType === 'UPDATE' && isRelevant(newMsg)) {
                        const index = activeMessagesArray.findIndex(m => m.id === newMsg.id);
                        if (index !== -1) {
                            activeMessagesArray[index] = newMsg;
                            renderMessages(activeMessagesArray);
                        }
                    } else if (payload.eventType === 'DELETE' && oldMsg) {
                        activeMessagesArray = activeMessagesArray.filter(m => m.id !== oldMsg.id);
                        renderMessages(activeMessagesArray);
                    }
                })
                .subscribe();
        }

        function renderMessages(messages) {
            const container = document.getElementById('chat-messages-container');
            container.innerHTML = '';

            if (messages.length === 0) {
                container.innerHTML = `<div class="text-center text-xs text-slate-500 py-6">هنوز پیامی رد و بدل نشده است.</div>`;
                return;
            }

            let htmlContent = '';
            messages.forEach(msg => {
                const isMe = String(msg.sender_id) === String(currentUser.id);
                const alignClass = isMe ? 'items-end' : 'items-start';
                const bubbleClass = isMe ? 'msg-bubble-out' : 'msg-bubble-in';
                const senderNameLabel = !isMe && currentChatType === 'public' ? `<span class="text-[10px] text-emerald-400 font-bold mb-0.5">${msg.sender_name || 'کاربر'}</span>` : '';

                const replyHtml = msg.reply_to_text ? `
                    <div class="bg-black/20 border-r-2 border-blue-400 px-2 py-1 mb-1 rounded text-[10px]">
                        <span class="text-blue-300 font-bold block">${msg.reply_to_name}</span>
                        <span class="text-slate-300 truncate block">${msg.reply_to_text}</span>
                    </div>
                ` : '';

                const timeStr = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const editActions = isMe ? `
                    <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition mt-0.5 text-[9px] px-1">
                        <button onclick="setEditMessage('${msg.id}', '${escapeHtml(msg.message).replace(/'/g, "\\'")}')" class="text-sky-400 hover:underline">ویرایش</button>
                        <button onclick="deleteMessage('${msg.id}')" class="text-red-400 hover:underline">حذف</button>
                        <button onclick="setReplyTo('${msg.id}', '${msg.sender_name || 'کاربر'}', '${escapeHtml(msg.message).replace(/'/g, "\\'")}')" class="text-slate-400 hover:text-white">پاسخ</button>
                    </div>
                ` : `
                    <button onclick="setReplyTo('${msg.id}', '${msg.sender_name || 'کاربر'}', '${escapeHtml(msg.message).replace(/'/g, "\\'")}')" class="text-[9px] text-slate-400 hover:text-white opacity-0 group-hover:opacity-100 transition mt-0.5 px-1">پاسخ (Reply)</button>
                `;

                htmlContent += `
                    <div class="flex flex-col ${alignClass} max-w-[85%] mx-auto w-full group">
                        ${senderNameLabel}
                        <div class="${bubbleClass} px-3.5 py-2 text-xs shadow relative">
                            ${replyHtml}
                            <div class="leading-relaxed break-words">${escapeHtml(msg.message)}</div>
                            <div class="flex items-center justify-end gap-1 mt-1">
                                <span class="text-[9px] text-slate-400">${timeStr}</span>
                                ${isMe ? '<span class="text-[9px] text-sky-400">✓✓</span>' : ''}
                            </div>
                        </div>
                        ${editActions}
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * (Math.PI/180);
            const dLon = (lon2 - lon1) * (Math.PI/180);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*(Math.PI/180)) * Math.cos(lat2*(Math.PI/180)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function centerToMyLocation() { if(map) map.setView([currentCoords.lat, currentCoords.lng], 16, { animate: true }); }
        function openUsersListModal() { renderUsersList(onlineUsersList); document.getElementById('users-list-modal').classList.remove('hidden'); }
        function closeUsersListModal() { document.getElementById('users-list-modal').classList.add('hidden'); }

        function filterUsersList(query) {
            const q = query.trim().toLowerCase();
            if (!q) { renderUsersList(onlineUsersList); return; }
            renderUsersList(onlineUsersList.filter(u => (u.name && u.name.toLowerCase().includes(q)) || (u.username && u.username.toLowerCase().includes(q))));
        }

        function renderUsersList(usersArray) {
            const container = document.getElementById('users-scroll-container');
            container.innerHTML = '';
            if (usersArray.length === 0) {
                container.innerHTML = `<div class="text-center text-xs text-slate-400 py-6">کاربر دیگری یافت نشد.</div>`;
                return;
            }

            usersArray.sort((a, b) => a.distance - b.distance);
            usersArray.forEach(user => {
                const avatarHtml = user.avatar_url ? `<img src="${user.avatar_url}" class="w-full h-full object-cover">` : (user.name ? user.name.charAt(0) : 'ک');
                const badgeHtml = user.isMe ? `<span class="text-[9px] font-bold text-blue-400 bg-blue-500/10 px-1.5 py-0.5 rounded mr-1.5">شما</span>` : `<span class="text-[9px] font-bold text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded mr-1.5">آنلاین</span>`;
                const actionBtn = user.isMe ? '' : `<button onclick="openChatModal('private', '${user.id}', '${user.name}', '${user.avatar_url || ''}')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl text-[11px] font-medium transition shadow">پیام</button>`;

                container.innerHTML += `
                    <div class="flex items-center justify-between p-2.5 bg-slate-800/60 hover:bg-slate-800 rounded-xl transition border border-slate-700/50">
                        <div class="flex items-center gap-3 cursor-pointer" onclick="if(!${user.isMe}) { closeUsersListModal(); map.setView([${user.lat}, ${user.lng}], 17, { animate: true }); }">
                            <div class="w-10 h-10 rounded-full bg-emerald-600/30 border border-emerald-400/30 flex items-center justify-center font-bold text-white text-xs overflow-hidden shadow relative">
                                ${avatarHtml}
                                <div class="online-dot"></div>
                            </div>
                            <div class="flex flex-col">
                                <div class="flex items-center">
                                    <span class="font-bold text-xs text-white">${user.name || 'کاربر'}</span>
                                    ${badgeHtml}
                                </div>
                                <span class="text-[10px] text-slate-400">@${user.username || 'بدون نام'}</span>
                            </div>
                        </div>
                        <div>${actionBtn}</div>
                    </div>
                `;
            });
        }
    </script>
</body>
