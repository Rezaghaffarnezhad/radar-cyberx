<!DOCTYPE html>
<html lang="fa" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلتفرم اجتماعی زنده</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0d1117; color: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .map-container { width: 100%; height: calc(100% - 70px); position: absolute; top: 0; left: 0; z-index: 1; }
        .glass { background: rgba(22, 27, 34, 0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(240, 246, 252, 0.1); }
        .custom-marker { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 2px solid #3b82f6; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.6); background: #1e293b; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .status-dot { position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #0d1117; background: #22c55e; }
        .leaflet-layer { filter: invert(100%) hue-rotate(180deg) brightness(90%) contrast(90%); }
        .leaflet-container { background-color: #0d1117 !important; }
        #toast { transition: transform 0.3s ease, opacity 0.3s ease; }
    </style>
</head>
<body class="relative flex flex-col h-full justify-between">

    <!-- بخش اصلی محتوا (تب‌ها) -->
    <div id="view-map" class="view-section relative w-full h-full">
        <div id="map" class="map-container"></div>
        <div class="absolute top-4 left-4 right-4 z-10 glass p-3 rounded-2xl flex items-center justify-between shadow-lg">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
                <span id="online-count" class="text-xs font-semibold tracking-wide">در حال اتصال...</span>
            </div>
            <button onclick="switchTab('global-chat')" class="bg-blue-600/80 hover:bg-blue-600 px-3.5 py-1.5 rounded-xl text-xs font-semibold shadow transition">چت عمومی 🌐</button>
        </div>
    </div>

    <!-- تب لیست کاربران آنلاین -->
    <div id="view-users" class="view-section hidden absolute inset-0 pb-20 pt-4 px-4 overflow-y-auto z-10 bg-[#0d1117]">
        <h2 class="font-bold text-lg mb-4">کاربران آنلاین در نزدیکی شما</h2>
        <div id="users-list-container" class="flex flex-col gap-3"></div>
    </div>

    <!-- تب چت عمومی -->
    <div id="view-global-chat" class="view-section hidden absolute inset-0 pb-20 pt-4 px-4 flex flex-col z-10 bg-[#0d1117]">
        <div class="flex items-center justify-between mb-3">
            <h2 class="font-bold text-lg">چت عمومی 🌐</h2>
        </div>
        <div id="global-chat-messages" class="flex-1 overflow-y-auto flex flex-col gap-3 p-2 glass rounded-2xl mb-3"></div>
        <div class="flex gap-2">
            <input id="global-chat-input" type="text" placeholder="پیام عمومی..." class="flex-1 bg-slate-900 px-4 py-3 rounded-2xl outline-none border border-slate-800 text-sm text-white focus:border-blue-500">
            <button onclick="sendGlobalMessage()" class="bg-blue-600 px-5 rounded-2xl font-semibold text-sm shadow hover:bg-blue-500">ارسال</button>
        </div>
    </div>

    <!-- تب پروفایل من -->
    <div id="view-profile" class="view-section hidden absolute inset-0 pb-20 pt-6 px-6 overflow-y-auto z-10 bg-[#0d1117] flex flex-col gap-5">
        <h2 class="font-bold text-xl">پروفایل من</h2>
        <div class="glass p-5 rounded-3xl flex flex-col gap-4 items-center shadow-lg">
            <div id="my-avatar" class="w-20 h-20 rounded-full bg-blue-600 flex items-center justify-center text-3xl font-bold text-white shadow-md">ک</div>
            <div class="w-full flex flex-col gap-3">
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">نام نمایشی</label>
                    <input id="input-my-name" type="text" class="w-full bg-slate-900 px-4 py-3 rounded-2xl outline-none border border-slate-800 text-sm text-white">
                </div>
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">بیوگرافی (درباره من)</label>
                    <textarea id="input-my-bio" rows="2" placeholder="مثلاً: عاشق برنامه‌نویسی و سفر..." class="w-full bg-slate-900 px-4 py-3 rounded-2xl outline-none border border-slate-800 text-sm text-white resize-none"></textarea>
                </div>
                <button onclick="saveProfile()" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl font-semibold shadow-lg hover:opacity-95 transition mt-2">ذخیره تغییرات</button>
            </div>
        </div>
    </div>

    <!-- پنجره پی‌وی (چت خصوصی) -->
    <div id="chat-window" class="hidden absolute inset-0 bg-[#0d1117] z-50 flex flex-col pb-4">
        <div class="p-4 glass flex items-center gap-3 border-b border-slate-800">
            <button onclick="closeChat()" class="text-slate-300 text-xl px-2">←</button>
            <h3 id="chat-title" class="font-bold text-base">پی‌وی</h3>
        </div>
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3"></div>
        <div class="p-4 glass flex gap-2 border-t border-slate-800">
            <input id="chat-input" type="text" placeholder="نوشتن پیام..." class="flex-1 bg-slate-900/80 px-4 py-3 rounded-2xl outline-none border border-slate-800 text-sm text-white focus:border-blue-500">
            <button onclick="sendPrivateMessage()" class="bg-blue-600 px-6 rounded-2xl font-semibold text-sm shadow hover:bg-blue-500">ارسال</button>
        </div>
    </div>

    <!-- کادر اعلان (Toast) -->
    <div id="toast" class="absolute top-20 left-4 right-4 z-50 transform -translate-y-20 opacity-0 pointer-events-none glass p-3.5 rounded-2xl border border-blue-500/30 shadow-xl flex items-center gap-3">
        <span class="text-xl">🔔</span>
        <div id="toast-text" class="text-xs font-medium text-slate-200">اعلان جدید</div>
    </div>

    <!-- منوی پایین صفحه (Bottom Navigation) -->
    <div class="absolute bottom-0 left-0 right-0 h-16 glass z-40 flex items-center justify-around border-t border-slate-800 px-2">
        <button onclick="switchTab('map')" id="nav-map" class="flex flex-col items-center gap-1 text-blue-500 transition">
            <span class="text-lg">🗺️</span>
            <span class="text-[10px] font-semibold">نقشه</span>
        </button>
        <button onclick="switchTab('users')" id="nav-users" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
            <span class="text-lg">👥</span>
            <span class="text-[10px] font-semibold">آنلاین‌ها</span>
        </button>
        <button onclick="switchTab('global-chat')" id="nav-global-chat" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
            <span class="text-lg">💬</span>
            <span class="text-[10px] font-semibold">چت عمومی</span>
        </button>
        <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
            <span class="text-lg">👤</span>
            <span class="text-[10px] font-semibold">پروفایل</span>
        </button>
    </div>

    <script>
        const SUPABASE_URL = "https://dxdskvkcmovotzxixxhd.supabase.co";
        const SUPABASE_KEY = "sb_publishable_3-rNuWmg9jAyPPQ89hE4ZQ_avo0wsPd";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let tg = window.Telegram?.WebApp;
        let currentUser = null, selectedTargetUser = null;
        let map, markers = {};

        const user = tg?.initDataUnsafe?.user || { 
            id: Math.floor(Math.random() * 900000) + 100000, 
            first_name: "کاربر " + Math.floor(Math.random() * 100), 
            username: "user_" + Math.random().toString(36).substring(7) 
        };

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = text;
            toast.classList.remove('-translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('-translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 4000);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${tabId}`).classList.remove('hidden');

            ['map', 'users', 'global-chat', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if(btn) {
                    btn.classList.replace('text-blue-500', 'text-slate-400');
                }
            });
            const activeBtn = document.getElementById(`nav-${tabId}`);
            if(activeBtn) {
                activeBtn.classList.replace('text-slate-400', 'text-blue-500');
            }

            if(tabId === 'map' && map) setTimeout(() => map.invalidateSize(), 200);
            if(tabId === 'global-chat') loadGlobalMessages();
        }

        async function init() {
            const { data } = await supabaseClient
                .from('users')
                .upsert({ 
                    telegram_id: user.id, 
                    name: user.first_name, 
                    username: user.username, 
                    latitude: 35.6892 + (Math.random() - 0.5) * 0.02, 
                    longitude: 51.3890 + (Math.random() - 0.5) * 0.02,
                    last_seen: new Date() 
                }, { onConflict: 'telegram_id' })
                .select()
                .single();

            if (data) {
                currentUser = data;
                document.getElementById('input-my-name').value = currentUser.name || '';
                document.getElementById('input-my-bio').value = currentUser.bio || '';
                document.getElementById('my-avatar').textContent = (currentUser.name || 'ک').charAt(0);
            }

            map = L.map('map', { zoomControl: false }).setView([35.6892, 51.3890], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            setInterval(fetchData, 4000);
            fetchData();
            initRealtime();
        }

        async function fetchData() {
            const { data } = await supabaseClient.from('users').select('*');
            if (data) {
                document.getElementById('online-count').textContent = `${data.length} نفر آنلاین`;
                
                // بروزرسانی لیست کاربران در تب آنلاین‌ها
                document.getElementById('users-list-container').innerHTML = data.map(u => `
                    <div onclick="openPrivateChat(${u.telegram_id}, '${u.name}')" class="glass p-3.5 rounded-2xl flex items-center gap-3 cursor-pointer hover:bg-slate-800 transition">
                        <div class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white">${(u.name || 'ک').charAt(0)}</div>
                        <div class="flex-1">
                            <h4 class="font-bold text-sm">${u.name || 'کاربر'}</h4>
                            <p class="text-xs text-slate-400 mt-0.5">${u.bio || 'بدون بیوگرافی'}</p>
                        </div>
                        <span class="text-xs text-green-400 font-semibold">● آنلاین</span>
                    </div>
                `).join('');

                const existingIds = data.map(u => u.telegram_id);
                Object.keys(markers).forEach(id => {
                    if (!existingIds.includes(Number(id))) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                });

                data.forEach(u => {
                    if (u.telegram_id === currentUser?.telegram_id || !u.latitude || !u.longitude) return;
                    const initial = u.name ? u.name.charAt(0) : '?';
                    const html = `<div class="custom-marker">${initial}<div class="status-dot"></div></div>`;
                    const icon = L.divIcon({ html, iconSize: [44, 44], iconAnchor: [22, 22] });

                    if (markers[u.telegram_id]) {
                        markers[u.telegram_id].setLatLng([u.latitude, u.longitude]);
                    } else {
                        const marker = L.marker([u.latitude, u.longitude], { icon }).addTo(map);
                        marker.on('click', () => openPrivateChat(u.telegram_id, u.name));
                        markers[u.telegram_id] = marker;
                    }
                });
            }
        }

        async function saveProfile() {
            const name = document.getElementById('input-my-name').value.trim();
            const bio = document.getElementById('input-my-bio').value.trim();
            if (!name) return;

            await supabaseClient.from('users').update({ name, bio }).eq('telegram_id', currentUser.telegram_id);
            currentUser.name = name;
            currentUser.bio = bio;
            document.getElementById('my-avatar').textContent = name.charAt(0);
            showToast("پروفایل با موفقیت ذخیره شد!");
        }

        function openPrivateChat(targetId, targetName) {
            selectedTargetUser = { telegram_id: targetId, name: targetName };
            document.getElementById('chat-title').textContent = `پی‌وی با ${targetName}`;
            document.getElementById('chat-window').classList.remove('hidden');
            loadPrivateMessages();
        }

        function closeChat() { document.getElementById('chat-window').classList.add('hidden'); }

        async function loadPrivateMessages() {
            if (!selectedTargetUser) return;
            const container = document.getElementById('chat-messages');
            const { data } = await supabaseClient.from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.telegram_id},receiver_id.eq.${selectedTargetUser.telegram_id}),and(sender_id.eq.${selectedTargetUser.telegram_id},receiver_id.eq.${currentUser.telegram_id})`)
                .order('created_at', { ascending: true });

            container.innerHTML = (data || []).map(m => `
                <div class="max-w-[75%] p-3.5 rounded-2xl text-sm ${m.sender_id === currentUser.telegram_id ? 'bg-blue-600 self-end rounded-br-none' : 'bg-slate-800 self-start rounded-bl-none'}">
                    ${m.message}
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        async function loadGlobalMessages() {
            const container = document.getElementById('global-chat-messages');
            const { data } = await supabaseClient.from('messages').select('*').is('receiver_id', null).order('created_at', { ascending: true });

            container.innerHTML = (data || []).map(m => `
                <div class="max-w-[85%] p-3 rounded-2xl text-sm ${m.sender_id === currentUser.telegram_id ? 'bg-blue-600 self-end rounded-br-none' : 'bg-slate-800 self-start rounded-bl-none'}">
                    <div class="text-[10px] text-blue-300 font-bold mb-1">${m.sender_name || 'کاربر'}</div>
                    ${m.message}
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        async function sendPrivateMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message || !selectedTargetUser) return;

            await supabaseClient.from('messages').insert([{
                sender_id: currentUser.telegram_id,
                sender_name: currentUser.name,
                receiver_id: selectedTargetUser.telegram_id,
                message
            }]);
            input.value = '';
            loadPrivateMessages();
        }

        async function sendGlobalMessage() {
            const input = document.getElementById('global-chat-input');
            const message = input.value.trim();
            if (!message) return;

            await supabaseClient.from('messages').insert([{
                sender_id: currentUser.telegram_id,
                sender_name: currentUser.name,
                receiver_id: null,
                message
            }]);
            input.value = '';
            loadGlobalMessages();
        }

        function initRealtime() {
            supabaseClient.channel('realtime-all')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    const m = payload.new;
                    if (m.sender_id !== currentUser?.telegram_id) {
                        if (!m.receiver_id) {
                            if (!document.getElementById('view-global-chat').classList.contains('hidden')) loadGlobalMessages();
                            showToast(`پیام عمومی از ${m.sender_name}`);
                        } else if (m.receiver_id === currentUser?.telegram_id) {
                            if (!document.getElementById('chat-window').classList.contains('hidden') && selectedTargetUser?.telegram_id === m.sender_id) {
                                loadPrivateMessages();
                            }
                            showToast(`پی‌وی جدید از ${m.sender_name}`);
                        }
                    }
                })
                .subscribe();
        }

        init();
    </script>
</body>
</html>
