<!DOCTYPE html>
<html lang="fa" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سوپر اپلیکیشن نقشه تلگرام</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');
        body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0e1621; color: #f5f5f5; font-family: 'Vazirmatn', sans-serif; }
        .map-container { width: 100%; height: calc(100% - 64px); position: absolute; top: 0; left: 0; z-index: 1; }
        .tg-bg { background: #17212b; }
        .tg-card { background: #232e3c; border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .tg-input { background: #18222d; border: 1.5px solid #2f3d4c; color: #fff; transition: all 0.2s ease; }
        .tg-input:focus { border-color: #5288c1; outline: none; box-shadow: 0 0 0 3px rgba(82, 136, 193, 0.15); }
        .custom-marker { position: relative; width: 46px; height: 46px; border-radius: 50%; border: 2.5px solid #5288c1; overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,0.6); background: #17212b; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; font-size: 16px; }
        .status-dot { position: absolute; bottom: 2px; right: 2px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid #17212b; background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .leaflet-layer { filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(90%); }
        .leaflet-container { background-color: #0e1621 !important; }
        #toast { transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        .pulse-ring { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }
    </style>
</head>
<body class="relative flex flex-col h-full justify-between select-none">

    <!-- تب ۱: نقشه زنده، فیلتر شعاع و پین‌ها -->
    <div id="view-map" class="view-section relative w-full h-full">
        <div id="map" class="map-container"></div>
        <div class="absolute top-4 left-4 right-4 z-10 flex flex-col gap-2.5">
            <!-- هدر اطلاعات و دکمه یادداشت -->
            <div class="tg-card px-4 py-3 rounded-2xl flex items-center justify-between shadow-2xl backdrop-blur-md bg-opacity-95">
                <div class="flex items-center gap-2.5">
                    <div class="w-3 h-3 rounded-full bg-emerald-500 pulse-ring"></div>
                    <span id="online-count" class="text-xs font-bold text-emerald-400">در حال ردیابی...</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openSearchModal()" class="tg-input hover:bg-[#2b3c50] px-3 py-2 rounded-xl text-xs font-bold text-slate-200 transition flex items-center gap-1 shadow">
                        <span>🔍</span> جستجو
                    </button>
                    <button onclick="openMapNoteModal()" class="bg-[#2b5278] hover:bg-[#386797] px-3 py-2 rounded-xl text-xs font-bold shadow-lg transition text-white flex items-center gap-1">
                        <span>📍</span> یادداشت
                    </button>
                </div>
            </div>
            <!-- نوار فیلتر شعاع لوکیشن (جدید) -->
            <div class="tg-card px-3 py-2 rounded-xl flex items-center justify-between text-xs backdrop-blur-md bg-opacity-90">
                <span class="text-slate-300 font-bold">شعاع نمایش:</span>
                <div class="flex gap-1.5">
                    <button onclick="setRadius(1)" id="rad-1" class="px-2.5 py-1 rounded-lg font-bold tg-input text-slate-300 transition">۱ ک‌م</button>
                    <button onclick="setRadius(5)" id="rad-5" class="px-2.5 py-1 rounded-lg font-bold tg-input text-slate-300 transition">۵ ک‌م</button>
                    <button onclick="setRadius(20)" id="rad-20" class="px-2.5 py-1 rounded-lg font-bold tg-input text-slate-300 transition">۲۰ ک‌م</button>
                    <button onclick="setRadius(0)" id="rad-0" class="px-2.5 py-1 rounded-lg font-bold bg-[#2b5278] text-white transition">همه</button>
                </div>
            </div>
        </div>
    </div>

    <!-- تب ۲: روم‌های گفتگو -->
    <div id="view-chats" class="view-section hidden absolute inset-0 pb-20 pt-4 px-4 flex flex-col z-10 tg-bg">
        <div class="flex items-center justify-between mb-3 px-1">
            <h2 class="font-extrabold text-sm text-slate-200">روم‌های گفتگوی زنده</h2>
            <span class="text-[10px] text-slate-400 tg-card px-2.5 py-1 rounded-full">آنلاین</span>
        </div>
        <div class="flex gap-2 overflow-x-auto pb-2 shrink-0 no-scrollbar">
            <button onclick="switchRoom('general')" id="room-btn-general" class="room-tab px-4 py-2 rounded-xl text-xs font-bold transition shrink-0 bg-[#2b5278] text-white shadow-md">🌐 عمومی</button>
            <button onclick="switchRoom('dev')" id="room-btn-dev" class="room-tab px-4 py-2 rounded-xl text-xs font-bold transition shrink-0 tg-card text-slate-300">💻 برنامه‌نویسان</button>
            <button onclick="switchRoom('hangout')" id="room-btn-hangout" class="room-tab px-4 py-2 rounded-xl text-xs font-bold transition shrink-0 tg-card text-slate-300">☕ کافه و پاتوق</button>
            <button onclick="switchRoom('gamer')" id="room-btn-gamer" class="room-tab px-4 py-2 rounded-xl text-xs font-bold transition shrink-0 tg-card text-slate-300">🎮 گیمرها</button>
        </div>
        <div id="room-messages" class="flex-1 overflow-y-auto flex flex-col gap-3 p-3.5 tg-card rounded-3xl my-2 shadow-inner"></div>
        <div class="flex gap-2 mt-1">
            <input id="room-input" type="text" placeholder="پیام خود را بنویسید..." class="flex-1 tg-input px-4 py-3 rounded-2xl text-xs">
            <button onclick="sendRoomMessage()" class="bg-[#2b5278] hover:bg-[#386797] px-6 rounded-2xl font-bold text-xs text-white shadow-lg transition">ارسال</button>
        </div>
    </div>

    <!-- تب ۳: جامعه و اعلانات -->
    <div id="view-community" class="view-section hidden absolute inset-0 pb-20 pt-4 px-4 overflow-y-auto z-10 tg-bg flex flex-col gap-4">
        <div class="flex justify-between items-center px-1">
            <h2 class="font-extrabold text-sm text-slate-200">جامعه و تابلو اعلانات</h2>
            <button onclick="openBoardModal()" class="bg-[#2b5278] hover:bg-[#386797] px-3.5 py-2 rounded-xl text-xs font-bold text-white shadow transition">➕ ثبت رویداد</button>
        </div>
        <div id="board-container" class="flex flex-col gap-3"></div>
        <h3 class="font-bold text-xs text-slate-300 mt-2 px-1">کاربران حاضر</h3>
        <div id="users-list-container" class="flex flex-col gap-2.5"></div>
    </div>

    <!-- تب ۴: پروفایل و استوری‌ها -->
    <div id="view-profile" class="view-section hidden absolute inset-0 pb-20 pt-4 px-4 overflow-y-auto z-10 tg-bg flex flex-col gap-4">
        <div class="tg-card p-5 rounded-3xl flex flex-col gap-3.5 shadow-xl">
            <div class="flex items-center gap-3.5">
                <div id="my-avatar" class="w-16 h-16 rounded-2xl bg-[#2b5278] flex items-center justify-center text-2xl font-extrabold text-white shadow-lg">ک</div>
                <div>
                    <h3 id="profile-display-name" class="font-bold text-base text-white">کاربر</h3>
                    <p id="profile-badge" class="text-[11px] text-amber-400 font-semibold mt-1 bg-amber-400/10 px-2.5 py-0.5 rounded-full inline-block border border-amber-400/20">⭐ امتیاز: ۱۰ | تازه وارد</p>
                </div>
            </div>
            <div>
                <label class="text-[11px] text-slate-400 mb-1.5 block font-medium">نام نمایشی</label>
                <input id="input-my-name" type="text" class="w-full tg-input px-4 py-3 rounded-2xl text-xs">
            </div>
            <div>
                <label class="text-[11px] text-slate-400 mb-1.5 block font-medium">بیوگرافی کوتاه</label>
                <textarea id="input-my-bio" rows="2" placeholder="درباره علایق خود بنویسید..." class="w-full tg-input px-4 py-3 rounded-2xl text-xs resize-none"></textarea>
            </div>
            <div class="flex items-center justify-between py-1.5 bg-[#18222d] px-4 rounded-2xl border border-[#2f3d4c]">
                <span class="text-xs text-slate-300 font-medium">حالت روح (مخفی شدن لوکیشن)</span>
                <input id="input-ghost-mode" type="checkbox" class="w-5 h-5 accent-[#5288c1] cursor-pointer">
            </div>
            <button onclick="saveProfile()" class="w-full py-3 bg-[#2b5278] hover:bg-[#386797] rounded-2xl font-bold text-xs text-white shadow-lg transition">ذخیره پروفایل</button>
        </div>

        <div class="tg-card p-5 rounded-3xl flex flex-col gap-3 shadow-xl">
            <h4 class="font-bold text-xs text-slate-200">انتشار استوری موقت (۲۴ ساعته)</h4>
            <input id="input-story-text" type="text" placeholder="الان کجایی یا چه حسی داری؟..." class="w-full tg-input px-4 py-3 rounded-2xl text-xs">
            <button onclick="postStory()" class="py-2.5 bg-[#2b5278] hover:bg-[#386797] rounded-2xl font-bold text-xs text-white shadow transition">انتشار استوری</button>
            <div id="stories-container" class="flex flex-col gap-2.5 mt-2"></div>
        </div>
    </div>

    <!-- پنل چت خصوصی (پی‌وی) -->
    <div id="chat-window" class="hidden absolute inset-0 tg-bg z-50 flex flex-col pb-4">
        <div class="p-4 tg-card flex items-center gap-3 border-b border-[#2f3d4c] shadow-md">
            <button onclick="closeChat()" class="text-slate-300 text-lg px-2.5 py-1 rounded-xl tg-card hover:bg-[#2b3c50] transition">←</button>
            <h3 id="chat-title" class="font-bold text-sm text-white">پی‌وی</h3>
        </div>
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3"></div>
        <div class="p-4 tg-card flex gap-2 border-t border-[#2f3d4c]">
            <input id="chat-input" type="text" placeholder="پیام خود را بنویسید..." class="flex-1 tg-input px-4 py-3 rounded-2xl text-xs">
            <button onclick="sendPrivateMessage()" class="bg-[#2b5278] hover:bg-[#386797] px-6 rounded-2xl font-bold text-xs text-white shadow transition">ارسال</button>
        </div>
    </div>

    <!-- مودال جستجوی پیشرفته (جدید) -->
    <div id="search-modal" class="hidden absolute inset-0 bg-black/75 backdrop-blur-sm z-50 flex flex-col p-4 animate-in fade-in">
        <div class="tg-card p-4 rounded-3xl w-full max-w-md mx-auto flex flex-col gap-3 shadow-2xl mt-4">
            <div class="flex items-center gap-2">
                <input id="global-search-input" oninput="handleSearch(this.value)" type="text" placeholder="جستجوی کاربر، یادداشت یا رویداد..." class="flex-1 tg-input p-3.5 rounded-2xl text-xs">
                <button onclick="closeSearchModal()" class="text-slate-400 hover:text-white px-3 py-2 tg-card rounded-2xl text-xs font-bold">بستن</button>
            </div>
            <div id="search-results" class="flex flex-col gap-2 max-h-72 overflow-y-auto mt-1"></div>
        </div>
    </div>

    <!-- مودال یادداشت روی نقشه -->
    <div id="map-note-modal" class="hidden absolute inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="tg-card p-6 rounded-3xl w-full max-w-sm flex flex-col gap-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-sm text-white">سنجاق یادداشت روی نقشه</h3>
                <button onclick="closeMapNoteModal()" class="text-slate-400 hover:text-white text-xs">✕</button>
            </div>
            <textarea id="map-note-input" rows="3" placeholder="یک پیام یادگاری یا معرفی پاتوق..." class="w-full tg-input p-3.5 rounded-2xl text-xs resize-none"></textarea>
            <div class="flex gap-2.5">
                <button onclick="submitMapNote()" class="flex-1 py-3 bg-[#2b5278] hover:bg-[#386797] rounded-2xl font-bold text-xs text-white shadow transition">ثبت روی نقشه</button>
                <button onclick="closeMapNoteModal()" class="flex-1 py-3 tg-card hover:bg-[#2b3c50] rounded-2xl font-bold text-xs text-slate-300 transition">انصراف</button>
            </div>
        </div>
    </div>

    <!-- مودال اعلانات محلی -->
    <div id="board-modal" class="hidden absolute inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="tg-card p-6 rounded-3xl w-full max-w-sm flex flex-col gap-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-sm text-white">ثبت رویداد یا آگهی محلی</h3>
                <button onclick="closeBoardModal()" class="text-slate-400 hover:text-white text-xs">✕</button>
            </div>
            <input id="board-title-input" type="text" placeholder="عنوان رویداد" class="w-full tg-input p-3.5 rounded-2xl text-xs">
            <textarea id="board-desc-input" rows="3" placeholder="توضیحات کامل..." class="w-full tg-input p-3.5 rounded-2xl text-xs resize-none"></textarea>
            <div class="flex gap-2.5">
                <button onclick="submitBoardPost()" class="flex-1 py-3 bg-[#2b5278] hover:bg-[#386797] rounded-2xl font-bold text-xs text-white shadow transition">انتشار</button>
                <button onclick="closeBoardModal()" class="flex-1 py-3 tg-card hover:bg-[#2b3c50] rounded-2xl font-bold text-xs text-slate-300 transition">انصراف</button>
            </div>
        </div>
    </div>

    <!-- سیستم اعلان Toast -->
    <div id="toast" class="absolute top-5 left-4 right-4 z-50 transform -translate-y-24 opacity-0 pointer-events-none tg-card px-4 py-3 rounded-2xl border border-[#5288c1]/40 shadow-2xl flex items-center gap-3">
        <span class="text-xl">🔔</span>
        <div id="toast-text" class="text-xs font-bold text-white">اعلان جدید</div>
    </div>

    <!-- منوی پایین (Telegram Navigation Bar) -->
    <div class="absolute bottom-0 left-0 right-0 h-16 tg-card z-40 flex items-center justify-around border-t border-[#2f3d4c] px-2 shadow-2xl">
        <button onclick="switchTab('map')" id="nav-map" class="flex flex-col items-center gap-0.5 text-[#5288c1] transition py-1 px-4 rounded-xl bg-[#5288c1]/10">
            <span class="text-xl">🗺️</span>
            <span class="text-[10px] font-bold">نقشه</span>
        </button>
        <button onclick="switchTab('chats')" id="nav-chats" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-200 transition py-1 px-4 rounded-xl">
            <span class="text-xl">💬</span>
            <span class="text-[10px] font-bold">روم‌ها</span>
        </button>
        <button onclick="switchTab('community')" id="nav-community" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-200 transition py-1 px-4 rounded-xl">
            <span class="text-xl">📢</span>
            <span class="text-[10px] font-bold">جامعه</span>
        </button>
        <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-200 transition py-1 px-4 rounded-xl">
            <span class="text-xl">👤</span>
            <span class="text-[10px] font-bold">پروفایل</span>
        </button>
    </div>

    <script>
        const SUPABASE_URL = "https://dxdskvkcmovotzxixxhd.supabase.co";
        const SUPABASE_KEY = "sb_publishable_3-rNuWmg9jAyPPQ89hE4ZQ_avo0wsPd";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        let currentUser = null, selectedTargetUser = null;
        let map, markers = {};
        let currentRoom = 'general';
        let currentCoords = { lat: 35.6892, lng: 51.3890 };
        let activeRadiusKm = 0; // 0 یعنی همه

        const user = tg?.initDataUnsafe?.user || { 
            id: Math.floor(Math.random() * 900000) + 100000, 
            first_name: "کاربر " + Math.floor(Math.random() * 100), 
            username: "user_" + Math.random().toString(36).substring(7) 
        };

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = text;
            toast.classList.remove('-translate-y-24', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('-translate-y-24', 'opacity-0', 'pointer-events-none');
            }, 3500);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${tabId}`).classList.remove('hidden');

            ['map', 'chats', 'community', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if(btn) {
                    btn.className = t === tabId ? 
                        "flex flex-col items-center gap-0.5 text-[#5288c1] transition py-1 px-4 rounded-xl bg-[#5288c1]/10 font-bold" : 
                        "flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-200 transition py-1 px-4 rounded-xl";
                }
            });

            if(tabId === 'map' && map) setTimeout(() => map.invalidateSize(), 200);
            if(tabId === 'chats') loadRoomMessages();
            if(tabId === 'community') { loadUsersList(); loadBoardPosts(); }
            if(tabId === 'profile') loadStories();
        }

        function setRadius(km) {
            activeRadiusKm = km;
            [1, 5, 20, 0].forEach(r => {
                const btn = document.getElementById(`rad-${r}`);
                if(btn) {
                    btn.className = r === km ? "px-2.5 py-1 rounded-lg font-bold bg-[#2b5278] text-white transition" : "px-2.5 py-1 rounded-lg font-bold tg-input text-slate-300 transition";
                }
            });
            fetchData();
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function init() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    currentCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    if(map) map.setView([currentCoords.lat, currentCoords.lng], 13);
                    updateMyLocation(currentCoords.lat, currentCoords.lng);
                });
            }

            const { data } = await supabaseClient
                .from('users')
                .upsert({ 
                    telegram_id: user.id, 
                    name: user.first_name, 
                    username: user.username, 
                    latitude: currentCoords.lat, 
                    longitude: currentCoords.lng,
                    last_seen: new Date() 
                }, { onConflict: 'telegram_id' })
                .select()
                .single();

            if (data) {
                currentUser = data;
                document.getElementById('input-my-name').value = currentUser.name || '';
                document.getElementById('input-my-bio').value = currentUser.bio || '';
                document.getElementById('input-ghost-mode').checked = currentUser.ghost_mode || false;
                document.getElementById('my-avatar').textContent = (currentUser.name || 'ک').charAt(0);
                document.getElementById('profile-display-name').textContent = currentUser.name;
                document.getElementById('profile-badge').textContent = `⭐ امتیاز: ${currentUser.points || 10} | ${currentUser.badge || 'تازه وارد'}`;
            }

            map = L.map('map', { zoomControl: false }).setView([currentCoords.lat, currentCoords.lng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            setInterval(fetchData, 3500);
            fetchData();
            initRealtime();
        }

        async function updateMyLocation(lat, lng) {
            if(!currentUser) return;
            await supabaseClient.from('users').update({ latitude: lat, longitude: lng, last_seen: new Date() }).eq('telegram_id', currentUser.telegram_id);
        }

        async function fetchData() {
            const { data } = await supabaseClient.from('users').select('*');
            if (data) {
                let activeUsers = data.filter(u => !u.ghost_mode);
                if (activeRadiusKm > 0) {
                    activeUsers = activeUsers.filter(u => {
                        if (!u.latitude || !u.longitude) return false;
                        return calculateDistance(currentCoords.lat, currentCoords.lng, u.latitude, u.longitude) <= activeRadiusKm;
                    });
                }

                document.getElementById('online-count').textContent = `${activeUsers.length} کاربر در شعاع فعال`;

                const existingIds = activeUsers.map(u => u.telegram_id);
                Object.keys(markers).forEach(id => {
                    if (!id.startsWith('note_') && !existingIds.includes(Number(id))) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                });

                activeUsers.forEach(u => {
                    if (u.telegram_id === currentUser?.telegram_id || !u.latitude || !u.longitude) return;
                    const initial = u.name ? u.name.charAt(0) : '?';
                    const html = `<div class="custom-marker">${initial}<div class="status-dot"></div></div>`;
                    const icon = L.divIcon({ html, iconSize: [46, 46], iconAnchor: [23, 23] });

                    if (markers[u.telegram_id]) {
                        markers[u.telegram_id].setLatLng([u.latitude, u.longitude]);
                    } else {
                        const marker = L.marker([u.latitude, u.longitude], { icon }).addTo(map);
                        marker.on('click', () => openPrivateChat(u.telegram_id, u.name));
                        markers[u.telegram_id] = marker;
                    }
                });
            }

            const { data: notes } = await supabaseClient.from('map_notes').select('*');
            if(notes) {
                notes.forEach(n => {
                    if(!markers['note_' + n.id]) {
                        const marker = L.marker([n.latitude, n.longitude]).addTo(map);
                        marker.bindPopup(`<div style="font-family:Vazirmatn; font-size:11px; color:#17212b; padding:2px;"><b>${n.user_name}</b><br>${n.message}</div>`);
                        markers['note_' + n.id] = marker;
                    }
                });
            }
        }

        async function saveProfile() {
            const name = document.getElementById('input-my-name').value.trim();
            const bio = document.getElementById('input-my-bio').value.trim();
            const ghost_mode = document.getElementById('input-ghost-mode').checked;
            if (!name) return;

            await supabaseClient.from('users').update({ name, bio, ghost_mode }).eq('telegram_id', currentUser.telegram_id);
            currentUser.name = name;
            currentUser.bio = bio;
            currentUser.ghost_mode = ghost_mode;
            document.getElementById('my-avatar').textContent = name.charAt(0);
            document.getElementById('profile-display-name').textContent = name;
            showToast("پروفایل شما با موفقیت ذخیره شد ✨");
        }

        function switchRoom(room) {
            currentRoom = room;
            ['general', 'dev', 'hangout', 'gamer'].forEach(r => {
                const btn = document.getElementById(`room-btn-${r}`);
                if(r === room) {
                    btn.className = "room-tab px-4 py-2 rounded-xl text-xs font-bold transition shrink-0 bg-[#2b5278] text-white shadow-md";
                } else {
                    btn.className = "room-tab px-4 py-2 rounded-xl text-xs font-bold transition shrink-0 tg-card text-slate-300";
                }
            });
            loadRoomMessages();
        }

        async function loadRoomMessages() {
            const container = document.getElementById('room-messages');
            const { data } = await supabaseClient.from('messages').select('*').eq('room_name', currentRoom).is('receiver_id', null).order('created_at', { ascending: true });

            container.innerHTML = (data || []).map(m => `
                <div class="max-w-[85%] p-3.5 rounded-2xl text-xs ${m.sender_id === currentUser.telegram_id ? 'bg-[#2b5278] text-white self-end rounded-br-none shadow-md' : 'tg-card text-slate-200 self-start rounded-bl-none'}">
                    <div class="text-[10px] text-[#5288c1] font-bold mb-1">${m.sender_name}</div>
                    <div class="leading-relaxed">${m.message}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        async function sendRoomMessage() {
            const input = document.getElementById('room-input');
            const message = input.value.trim();
            if (!message) return;

            await supabaseClient.from('messages').insert([{
                sender_id: currentUser.telegram_id,
                sender_name: currentUser.name,
                receiver_id: null,
                room_name: currentRoom,
                message
            }]);
            input.value = '';
            loadRoomMessages();
        }

        async function loadUsersList() {
            const { data } = await supabaseClient.from('users').select('*');
            if(data) {
                document.getElementById('users-list-container').innerHTML = data.map(u => `
                    <div onclick="openPrivateChat(${u.telegram_id}, '${u.name}')" class="tg-card p-3.5 rounded-2xl flex items-center gap-3.5 cursor-pointer hover:bg-[#2b3c50] transition shadow-sm">
                        <div class="w-11 h-11 rounded-xl bg-[#2b5278] flex items-center justify-center font-bold text-white text-sm shadow">${(u.name || 'ک').charAt(0)}</div>
                        <div class="flex-1">
                            <h4 class="font-bold text-xs text-white">${u.name}</h4>
                            <p class="text-[11px] text-slate-400 mt-0.5 line-clamp-1">${u.bio || 'بدون بیوگرافی'}</p>
                        </div>
                        <span class="text-[10px] text-emerald-400 font-bold bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">● آنلاین</span>
                    </div>
                `).join('');
            }
        }

        function openPrivateChat(targetId, targetName) {
            selectedTargetUser = { telegram_id: targetId, name: targetName };
            document.getElementById('chat-title').textContent = `پی‌وی با ${targetName}`;
            document.getElementById('chat-window').classList.remove('hidden');
            loadPrivateMessages();
        }

        function closeChat() { document.getElementById('chat-window').classList.add('hidden'); }

        async function loadPrivateMessages() {
            if (!selectedTargetUser) return;
            const container = document.getElementById('chat-messages');
            const { data } = await supabaseClient.from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.telegram_id},receiver_id.eq.${selectedTargetUser.telegram_id}),and(sender_id.eq.${selectedTargetUser.telegram_id},receiver_id.eq.${currentUser.telegram_id})`)
                .order('created_at', { ascending: true });

            container.innerHTML = (data || []).map(m => `
                <div class="max-w-[75%] p-3.5 rounded-2xl text-xs ${m.sender_id === currentUser.telegram_id ? 'bg-[#2b5278] text-white self-end rounded-br-none shadow-md' : 'tg-card text-slate-200 self-start rounded-bl-none'}">
                    <div class="leading-relaxed">${m.message}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        async function sendPrivateMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message || !selectedTargetUser) return;

            await supabaseClient.from('messages').insert([{
                sender_id: currentUser.telegram_id,
                sender_name: currentUser.name,
                receiver_id: selectedTargetUser.telegram_id,
                message
            }]);
            input.value = '';
            loadPrivateMessages();
        }

        async function postStory() {
            const content = document.getElementById('input-story-text').value.trim();
            if(!content) return;
            await supabaseClient.from('stories').insert([{ user_id: currentUser.telegram_id, user_name: currentUser.name, content }]);
            document.getElementById('input-story-text').value = '';
            showToast("استوری شما منتشر شد ⚡");
            loadStories();
        }

        async function loadStories() {
            const { data } = await supabaseClient.from('stories').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('stories-container');
            if(data) {
                container.innerHTML = data.map(s => `
                    <div class="tg-card p-3 rounded-2xl text-xs flex flex-col gap-1 shadow-sm">
                        <span class="font-bold text-[#5288c1] text-[11px]">${s.user_name}</span>
                        <p class="text-slate-300 leading-relaxed">${s.content}</p>
                    </div>
                `).join('');
            }
        }

        function openSearchModal() { document.getElementById('search-modal').classList.remove('hidden'); }
        function closeSearchModal() { document.getElementById('search-modal').classList.add('hidden'); }

        async function handleSearch(query) {
            const container = document.getElementById('search-results');
            if(!query.trim()) { container.innerHTML = ''; return; }

            const { data: users } = await supabaseClient.from('users').select('*').ilike('name', `%${query}%`);
            const { data: notes } = await supabaseClient.from('map_notes').select('*').ilike('message', `%${query}%`);

            let html = '';
            if(users && users.length > 0) {
                html += `<div class="text-[10px] text-slate-400 font-bold mb-1">کاربران</div>`;
                html += users.map(u => `
                    <div onclick="closeSearchModal(); openPrivateChat(${u.telegram_id}, '${u.name}')" class="tg-card p-2.5 rounded-xl cursor-pointer hover:bg-[#2b3c50] text-xs font-bold text-white flex justify-between">
                        <span>${u.name}</span>
                        <span class="text-[10px] text-emerald-400">پی‌وی</span>
                    </div>
                `).join('');
            }
            if(notes && notes.length > 0) {
                html += `<div class="text-[10px] text-slate-400 font-bold mt-2 mb-1">یادداشت‌های نقشه</div>`;
                html += notes.map(n => `
                    <div class="tg-card p-2.5 rounded-xl text-xs text-slate-200">
                        <b class="text-[#5288c1]">${n.user_name}:</b> ${n.message}
                    </div>
                `).join('');
            }
            container.innerHTML = html || `<div class="text-center text-xs text-slate-400 py-4">نتیجه‌ای یافت نشد</div>`;
        }

        function openMapNoteModal() { document.getElementById('map-note-modal').classList.remove('hidden'); }
        function closeMapNoteModal() { document.getElementById('map-note-modal').classList.add('hidden'); }
        async function submitMapNote() {
            const message = document.getElementById('map-note-input').value.trim();
            if(!message) return;
            await supabaseClient.from('map_notes').insert([{
                user_id: currentUser.telegram_id,
                user_name: currentUser.name,
                latitude: currentCoords.lat + (Math.random() - 0.5) * 0.003,
                longitude: currentCoords.lng + (Math.random() - 0.5) * 0.003,
                message
            }]);
            closeMapNoteModal();
            showToast("یادداشت شما روی نقشه سنجاق شد 📍");
            fetchData();
        }

        function openBoardModal() { document.getElementById('board-modal').classList.remove('hidden'); }
        function closeBoardModal() { document.getElementById('board-modal').classList.add('hidden'); }
        async function submitBoardPost() {
            const title = document.getElementById('board-title-input').value.trim();
            const description = document.getElementById('board-desc-input').value.trim();
            if(!title || !description) return;
            await supabaseClient.from('board_posts').insert([{ user_id: currentUser.telegram_id, user_name: currentUser.name, title, description }]);
            closeBoardModal();
            showToast("رویداد شما در تابلو اعلانات ثبت شد 📢");
            loadBoardPosts();
        }

        async function loadBoardPosts() {
            const { data } = await supabaseClient.from('board_posts').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('board-container');
            if(data) {
                container.innerHTML = data.map(p => `
                    <div class="tg-card p-4 rounded-2xl flex flex-col gap-1.5 shadow-sm">
                        <div class="flex justify-between items-center">
                            <h4 class="font-bold text-xs text-[#5288c1]">${p.title}</h4>
                            <span class="text-[10px] text-slate-400 bg-[#18222d] px-2.5 py-0.5 rounded-md border border-[#2f3d4c]">${p.user_name}</span>
                        </div>
                        <p class="text-xs text-slate-300 leading-relaxed">${p.description}</p>
                    </div>
                `).join('');
            }
        }

        function initRealtime() {
            supabaseClient.channel('realtime-all')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    const m = payload.new;
                    if (m.sender_id !== currentUser?.telegram_id) {
                        if (!m.receiver_id && m.room_name === currentRoom) loadRoomMessages();
                        if (m.receiver_id === currentUser?.telegram_id) {
                            if (!document.getElementById('chat-window').classList.contains('hidden') && selectedTargetUser?.telegram_id === m.sender_id) loadPrivateMessages();
                            showToast(`پی‌وی جدید از ${m.sender_name} 💬`);
                        }
                    }
                })
                .subscribe();
        }

        init();
    </script>
</body>
</html>
