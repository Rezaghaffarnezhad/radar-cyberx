<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar CyberX - Live Realtime</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0; padding: 0; background-color: #0b0f19;
            font-family: Tahoma, sans-serif; -webkit-font-smoothing: antialiased;
            overflow: hidden; color: #f5f6f8;
        }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        .map-style-dark .leaflet-tile-pane {
            filter: brightness(0.3) invert(1) contrast(3) hue-rotate(200deg) saturate(0.2);
        }
        .map-style-light .leaflet-tile-pane { filter: none; }
        .map-style-satellite .leaflet-tile-pane { filter: brightness(0.85) contrast(1.3) saturate(0.75); }

        .tg-tap { transition: transform 0.1s ease, opacity 0.1s ease; cursor: pointer; }
        .tg-tap:active { transform: scale(0.94); opacity: 0.8; }

        .telegram-main-header {
            position: absolute; top: 0; left: 0; right: 0; z-index: 1010;
            background: rgba(23, 33, 43, 0.88); backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding: 10px 14px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .header-right-side { display: flex; align-items: center; gap: 10px; }
        .mini-avatar {
            width: 34px; height: 34px; background: linear-gradient(135deg, #6aa0f3, #4377d1);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; color: #fff;
            box-shadow: 0 0 10px rgba(106, 160, 243, 0.4);
        }
        .header-titles { display: flex; flex-direction: column; gap: 1px; }
        .header-titles h1 { margin: 0; font-size: 14px; font-weight: 600; color: #fff; }
        .header-titles span { font-size: 10px; color: #7f91a8; }

        .map-controls-group {
            position: absolute; top: 75px; right: 14px; z-index: 1008;
            display: flex; flex-direction: column; gap: 8px;
        }
        .map-style-switcher, .map-gps-btn {
            background: rgba(23, 33, 43, 0.88); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 6px;
            display: flex; flex-direction: column; gap: 6px; align-items: center;
        }
        .style-btn, .gps-action-btn {
            background: rgba(23, 33, 43, 0.88); border: 1px solid rgba(255, 255, 255, 0.08);
            color: #7f91a8; width: 34px; height: 34px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .style-btn.active, .gps-action-btn:hover { background: rgba(106, 160, 243, 0.25); color: #6aa0f3; border-color: rgba(106, 160, 243, 0.4); }

        .app-view-container {
            position: absolute; top: 0; left: 0; right: 0; bottom: 65px;
            z-index: 1005; background: #0b0f19; overflow-y: auto; display: none;
            padding: 70px 16px 20px 16px; box-sizing: border-box;
        }
        .app-view-container.active { display: block; }
        .section-title { font-size: 12px; color: #7f91a8; margin: 16px 8px 8px 8px; font-weight: bold; }

        .radar-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .radar-stat-card, .radar-status-card, .profile-header-card {
            background: rgba(23, 33, 43, 0.6); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px; padding: 14px; backdrop-filter: blur(10px); margin-bottom: 10px;
        }
        .radar-stat-title { font-size: 11px; color: #7f91a8; margin-bottom: 6px; }
        .radar-stat-value { font-size: 18px; font-weight: bold; color: #fff; }
        .pulse-indicator { width: 12px; height: 12px; background: #27ae60; border-radius: 50%; box-shadow: 0 0 12px #27ae60; }

        .chat-container { display: flex; flex-direction: column; height: 100%; gap: 10px; box-sizing: border-box; padding-bottom: 20px;}
        .chat-messages-box { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-bubble {
            background: rgba(23, 33, 43, 0.9); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px; padding: 10px 12px; max-width: 85%;
        }
        .chat-bubble.system { background: rgba(106, 160, 243, 0.15); border-color: rgba(106, 160, 243, 0.3); align-self: center; text-align: center; width: 100%; }
        .chat-bubble.mine { background: rgba(39, 174, 96, 0.2); border-color: rgba(39, 174, 96, 0.4); align-self: flex-end; }
        .chat-bubble.other { background: rgba(23, 33, 43, 0.9); align-self: flex-start; }
        .chat-sender { font-size: 10px; color: #6aa0f3; margin-bottom: 3px; font-weight: bold; }
        .chat-text { font-size: 12px; color: #fff; margin: 0; word-break: break-word; }
        .chat-time { font-size: 9px; color: #7f91a8; text-align: left; margin-top: 4px; }
        
        .chat-input-row { display: flex; gap: 8px; margin-top: 10px; }
        .chat-input { flex: 1; background: rgba(23, 33, 43, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 10px; color: #fff; font-size: 12px; outline: none; }
        .chat-send-btn { background: #6aa0f3; border: none; border-radius: 12px; width: 42px; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .telegram-bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 1010;
            background: rgba(23, 33, 43, 0.88); backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-around;
            align-items: center; height: 65px;
        }
        .telegram-bottom-nav .nav-item {
            text-decoration: none; display: flex; flex-direction: column; align-items: center;
            justify-content: center; color: #7f91a8; font-size: 10px; width: 100%; height: 100%;
        }
        .telegram-bottom-nav .nav-item.active { color: #6aa0f3; }
    </style>
</head>
<body class="map-style-dark">

    <div id="map"></div>

    <div class="map-controls-group" id="map-controls-group">
        <div class="map-gps-btn">
            <button class="gps-action-btn tg-tap" id="center-my-loc" title="موقعیت من"><i class="fas fa-crosshairs"></i></button>
        </div>
        <div class="map-style-switcher">
            <button class="style-btn tg-tap active" data-style="dark"><i class="fas fa-moon"></i></button>
            <button class="style-btn tg-tap" data-style="light"><i class="fas fa-sun"></i></button>
            <button class="style-btn tg-tap" data-style="satellite"><i class="fas fa-globe"></i></button>
        </div>
    </div>

    <!-- تب رادار -->
    <div id="radar-view" class="app-view-container">
        <div class="section-title">وضعیت زنده کاربران در شعاع 10 کیلومتری</div>
        <div class="radar-stats-grid">
            <div class="radar-stat-card">
                <div class="radar-stat-title">کاربران آنلاین اطراف</div>
                <div class="radar-stat-value" id="stat-users-count">0</div>
            </div>
            <div class="radar-stat-card">
                <div class="radar-stat-title">شعاع رادار</div>
                <div class="radar-stat-value">10 KM</div>
            </div>
        </div>
        <div class="radar-status-card">
            <div><h4>ارتباط زنده GPS</h4><p>موقعیت شما برای کاربران نزدیک به شما قابل مشاهده است.</p></div>
            <div class="pulse-indicator"></div>
        </div>
    </div>

    <!-- تب چت عمومی زنده -->
    <div id="chats-view" class="app-view-container">
        <div class="section-title">ارتباط و چت زنده اعضای شبکه</div>
        <div class="chat-container">
            <div id="chat-messages-box" class="chat-messages-box"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input-field" class="chat-input" placeholder="پیام خود را برای اعضا بنویسید...">
                <button id="chat-send-btn" class="chat-send-btn tg-tap"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- تب تنظیمات -->
    <div id="settings-view" class="app-view-container">
        <div class="profile-header-card" style="text-align: center;">
            <div class="mini-avatar" id="profile-avatar" style="width:70px; height:70px; font-size:24px; margin:0 auto 10px auto;">RC</div>
            <h3 id="profile-name" style="margin:0; color:#fff;">کاربر مینی‌اپ</h3>
            <p id="profile-username" style="margin:5px 0 0 0; font-size:12px; color:#6aa0f3;">@OnlineUser</p>
        </div>
    </div>

    <!-- هدر -->
    <header class="telegram-main-header">
        <div class="header-right-side">
            <div class="mini-avatar" id="header-avatar">RC</div>
            <div class="header-titles">
                <h1 id="header-title-text">رادار زنده</h1>
                <span id="header-subtitle-text">در حال اتصال به GPS...</span>
            </div>
        </div>
    </header>

    <!-- منوی پایین -->
    <nav class="telegram-bottom-nav">
        <a href="#" class="nav-item tg-tap active" data-page="map"><i class="fas fa-map"></i><span>نقشه</span></a>
        <a href="#" class="nav-item tg-tap" data-page="radar"><i class="fas fa-satellite-dish"></i><span>رادار</span></a>
        <a href="#" class="nav-item tg-tap" data-page="chats"><i class="fas fa-comments"></i><span>چت زنده</span></a>
        <a href="#" class="nav-item tg-tap" data-page="settings"><i class="fas fa-cog"></i><span>پروفایل</span></a>
    </nav>

    <!-- اسکریپت‌ها -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let myUserId = 'user_' + Math.random().toString(36).substring(2, 9);
        let myName = 'کاربر مهمان';

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            myUserId = 'tg_' + user.id;
            myName = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'کاربر تلگرام';
            document.getElementById('profile-name').textContent = myName;
            document.getElementById('header-title-text').textContent = myName;
            if (user.username) document.getElementById('profile-username').textContent = `@${user.username}`;
            const initials = user.first_name ? user.first_name.substring(0, 2).toUpperCase() : 'RC';
            document.getElementById('profile-avatar').textContent = initials;
            document.getElementById('header-avatar').textContent = initials;
        }

        var map = L.map('map', { zoomControl: false }).setView([35.6892, 51.3890], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        const markersGroup = L.layerGroup().addTo(map);

        let myCurrentLat = 35.6892;
        let myCurrentLon = 51.3890;

        function initRealtimeLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        myCurrentLat = position.coords.latitude;
                        myCurrentLon = position.coords.longitude;
                        document.getElementById('header-subtitle-text').textContent = 'GPS فعال و آنلاین';
                        sendMyPositionToServer();
                    },
                    (error) => {
                        console.error("خطای GPS:", error);
                        document.getElementById('header-subtitle-text').textContent = 'خطا در دسترسی به GPS';
                    },
                    { enableHighAccuracy: true, maximumAge: 5000, timeout: 5000 }
                );
            }
        }

        function sendMyPositionToServer() {
            fetch('/api/update-location', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: myUserId, name: myName, lat: myCurrentLat, lon: myCurrentLon })
            })
            .then(res => res.json())
            .then(response => {
                if (response.status === 'success') {
                    renderNearbyUsers(response.nearby_users);
                }
            });
        }

        function renderNearbyUsers(usersList) {
            markersGroup.clearLayers();
            let count = 0;
            usersList.forEach(u => {
                count++;
                const isMe = (u.id === myUserId);
                const markerColor = isMe ? '#27ae60' : '#6aa0f3';
                
                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div style="background-color:${markerColor}; width:16px; height:16px; border:3px solid #fff; border-radius:50%; box-shadow:0 0 10px ${markerColor};"></div>`,
                    iconSize: [22, 22],
                    iconAnchor: [11, 11]
                });

                const marker = L.marker([u.lat, u.lon], { icon: customIcon }).addTo(markersGroup);
                marker.bindPopup(`<b>${u.name} ${isMe ? '(شما)' : ''}</b><br>در شعاع 10 کیلومتری`);
            });
            document.getElementById('stat-users-count').textContent = count;
        }

        document.getElementById('center-my-loc').addEventListener('click', () => {
            map.setView([myCurrentLat, myCurrentLon], 15);
        });

        initRealtimeLocation();
        setInterval(sendMyPositionToServer, 8000);

        const styleButtons = document.querySelectorAll('.style-btn');
        styleButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                styleButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.body.className = `map-style-${this.getAttribute('data-style')}`;
            });
        });

        const navItems = document.querySelectorAll('.telegram-bottom-nav .nav-item');
        const views = document.querySelectorAll('.app-view-container');
        const mapControlsGroup = document.getElementById('map-controls-group');

        navItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                navItems.forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
                const pageName = this.getAttribute('data-page');

                views.forEach(v => v.classList.remove('active'));

                if (pageName === 'map') {
                    mapControlsGroup.style.display = 'flex';
                    setTimeout(() => map.invalidateSize(), 100);
                } else {
                    mapControlsGroup.style.display = 'none';
                    if (pageName === 'radar') document.getElementById('radar-view').classList.add('active');
                    else if (pageName === 'chats') {
                        document.getElementById('chats-view').classList.add('active');
                        loadChatMessages();
                    }
                    else if (pageName === 'settings') document.getElementById('settings-view').classList.add('active');
                }
            });
        });

        function loadChatMessages() {
            fetch('/api/chats')
            .then(res => res.json())
            .then(response => {
                if (response.status === 'success') {
                    const box = document.getElementById('chat-messages-box');
                    box.innerHTML = '';
                    response.data.forEach(msg => {
                        const bubble = document.createElement('div');
                        const isMine = (msg.sender_id === myUserId);
                        const bubbleClass = msg.is_system ? 'system' : (isMine ? 'mine' : 'other');
                        
                        bubble.className = `chat-bubble ${bubbleClass}`;
                        bubble.innerHTML = `
                            ${!msg.is_system ? `<div class="chat-sender">${msg.sender}</div>` : ''}
                            <p class="chat-text">${msg.message}</p>
                            <div class="chat-time">${msg.time}</div>
                        `;
                        box.appendChild(bubble);
                    });
                    box.scrollTop = box.scrollHeight;
                }
            });
        }

        document.getElementById('chat-send-btn').addEventListener('click', sendChatMessage);
        document.getElementById('chat-input-field').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendChatMessage();
        });

        function sendChatMessage() {
            const input = document.getElementById('chat-input-field');
            const message = input.value.trim();
            if (!message) return;

            fetch('/api/chats', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender_id: myUserId, sender: myName, message: message })
            })
            .then(res => res.json())
            .then(response => {
                if (response.status === 'success') {
                    input.value = '';
                    loadChatMessages();
                }
            });
        }

        setInterval(() => {
            if (document.getElementById('chats-view').classList.contains('active')) {
                loadChatMessages();
            }
        }, 3000);
    </script>
</body>
</html>
