<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست ارتباط دو اکانت</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-5 select-none flex flex-col items-center justify-center min-h-screen">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-5 rounded-3xl shadow-2xl flex flex-col gap-4">
        
        <!-- عنوان -->
        <div class="text-center pb-2 border-b border-slate-800">
            <h1 class="font-bold text-base text-white">🧪 تست ارتباط دو اکانت</h1>
            <p class="text-[11px] text-slate-400 mt-1">این صفحه را روی دو دستگاه یا دو مرورگر مختلف باز کنید</p>
        </div>

        <!-- کارت مشخصات شما -->
        <div class="bg-slate-950/80 p-3 rounded-2xl border border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div id="my-avatar" class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-sm overflow-hidden border border-blue-400">ک</div>
                <div>
                    <div id="my-name" class="font-bold text-xs text-white">در حال دریافت...</div>
                    <div id="my-id" class="text-[10px] text-slate-400 font-mono">ID: ---</div>
                </div>
            </div>
            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 font-bold px-2 py-1 rounded-lg border border-emerald-500/20">🟢 شما آنلاینید</span>
        </div>

        <!-- دکمه ارسال پینگ دستی -->
        <button onclick="sendPing()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 active:scale-95 transition rounded-xl font-bold text-xs shadow-lg text-white">
            ارسال پینگ / ثبت حضور
        </button>

        <!-- لیست دستگاه‌های متصل دیگر -->
        <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between text-xs text-slate-300 px-1 font-bold">
                <span>📡 اکانت‌های آنلاینِ شناسایی‌شده:</span>
                <span id="active-count" class="bg-slate-800 px-2 py-0.5 rounded text-[10px]">0</span>
            </div>

            <div id="other-users-box" class="flex flex-col gap-2 max-h-52 overflow-y-auto pr-1">
                <div class="text-center text-xs text-slate-500 py-6 bg-slate-950/40 rounded-xl border border-slate-800/50">
                    هنوز اکانت دیگری متصل نشده است...
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dxdskvkcmovotzxixxhd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3-rNuWmg9jAyPPQ89hE4ZQ_avo0wsPd';
        let supabaseClient = null;

        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error("خطا در اتصال به ساب‌پیس", e);
        }

        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        const tgUser = tg?.initDataUnsafe?.user;
        
        // ساخت شناسهتا اگر در دو تب مختلف تست می‌کنید IDs متفاوت تولید شود
        let myId = tgUser ? String(tgUser.id) : ('browser_' + Math.floor(Math.random() * 90000 + 10000));
        let myName = tgUser ? `${tgUser.first_name || ''} ${tgUser.last_name || ''}`.trim() : ('کاربر تستی ' + myId.split('_')[1]);
        let myUsername = tgUser?.username || ('user_' + Math.floor(Math.random() * 1000));
        let myAvatar = tgUser?.photo_url || '';

        window.addEventListener('DOMContentLoaded', () => {
            renderMyInfo();
            sendPing();
            setupRealtimeSync();

            // هر ۱۰ ثانیه خودکار پینگ می‌فرستد تا آنلاین بودن حفظ شود
            setInterval(sendPing, 10000);
        });

        function renderMyInfo() {
            document.getElementById('my-name').textContent = myName;
            document.getElementById('my-id').textContent = '@' + myUsername + ' (شناسه: ' + myId + ')';
            const avatarEl = document.getElementById('my-avatar');
            if (myAvatar) {
                avatarEl.innerHTML = `<img src="${myAvatar}" class="w-full h-full object-cover">`;
            } else {
                avatarEl.textContent = myName.charAt(0);
            }
        }

        async function sendPing() {
            if (!supabaseClient) return;
            try {
                await supabaseClient.from('users').upsert({
                    id: myId,
                    name: myName,
                    username: myUsername,
                    avatar_url: myAvatar,
                    lat: 35.6892, // مقدار ثابت برای تست
                    lng: 51.3890,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'id' });

                fetchOnlineUsers();
            } catch (err) {
                console.error("خطا در ارسال پینگ:", err);
            }
        }

        async function fetchOnlineUsers() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient.from('users').select('*');
                if (error) {
                    console.error("خطا در خواندن کاربران:", error);
                    return;
                }
                if (data) {
                    renderUsers(data);
                }
            } catch (err) {
                console.error("خطا:", err);
            }
        }

        function setupRealtimeSync() {
            if (!supabaseClient) return;
            supabaseClient
                .channel('public:users')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, payload => {
                    console.log('تغییر لحظه‌ای دریافت شد:', payload);
                    fetchOnlineUsers();
                })
                .subscribe();
        }

        function renderUsers(users) {
            const box = document.getElementById('other-users-box');
            box.innerHTML = '';
            document.getElementById('active-count').textContent = users.length;

            if (users.length === 0) {
                box.innerHTML = `<div class="text-center text-xs text-slate-500 py-6 bg-slate-950/40 rounded-xl border border-slate-800/50">کاربری یافت نشد.</div>`;
                return;
            }

            users.forEach(user => {
                const isMe = String(user.id) === String(myId);
                const initial = user.name ? user.name.charAt(0) : 'ک';
                const avatarHtml = user.avatar_url ? `<img src="${user.avatar_url}" class="w-full h-full object-cover">` : initial;
                
                const badge = isMe 
                    ? `<span class="text-[9px] bg-blue-500/20 text-blue-400 font-bold px-2 py-0.5 rounded-md">این دستگاه (شما)</span>` 
                    : `<span class="text-[9px] bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded-md">قابل دسترس 🟢</span>`;

                box.innerHTML += `
                    <div class="flex items-center justify-between p-3 bg-slate-950/60 border border-slate-800/80 rounded-2xl shadow-inner">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center font-bold text-xs overflow-hidden border border-slate-700 shrink-0">
                                ${avatarHtml}
                            </div>
                            <div class="flex flex-col">
                                <span class="font-bold text-xs text-white">${user.name || 'بدون نام'}</span>
                                <span class="text-[10px] text-slate-400">@${user.username || 'no_username'}</span>
                            </div>
                        </div>
                        <div>
                            ${badge}
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
