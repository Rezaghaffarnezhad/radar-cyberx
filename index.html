<!DOCTYPE html>
<html lang="fa" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نقشه با لوکیشن پالس‌دار</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');
        body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0e1621; color: #f5f5f5; font-family: 'Vazirmatn', sans-serif; }
        .map-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .glass-box {
            background: rgba(23, 33, 43, 0.45);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* استایل دقیق نشانگر پالس‌دار آبی */
        .pulse-marker-container {
            position: relative;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pulse-core {
            width: 18px;
            height: 18px;
            background: #2563eb;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.8);
            z-index: 2;
        }
        .pulse-ring {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(37, 99, 235, 0.35);
            border-radius: 50%;
            animation: map-pulse 2s infinite ease-out;
            z-index: 1;
        }
        @keyframes map-pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .transparent-location-btn {
            background: rgba(23, 33, 43, 0.75) !important;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
        }
        .transparent-location-btn:hover { background: rgba(35, 46, 60, 0.85) !important; }

        .leaflet-container { background-color: #0e1621 !important; }
        .dark-map .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }

        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body class="relative flex flex-col h-full justify-between select-none">

    <div id="view-map" class="view-section relative w-full h-full">
        <div id="map" class="map-container"></div>
        
        <div class="absolute top-3 left-3 right-3 z-10 pointer-events-none">
            <div class="glass-box px-3 py-2 rounded-2xl flex items-center justify-between gap-2 shadow-2xl pointer-events-auto">
                <div class="text-xs font-bold text-white">نقشه زنده</div>
                <div class="flex items-center gap-2">
                    <button onclick="toggleMapTheme()" class="w-8 h-8 rounded-xl flex items-center justify-center text-sm bg-slate-800/80 text-white hover:bg-slate-700 transition shadow" title="تغییر حالت نقشه">🌓</button>
                </div>
            </div>
        </div>

        <div class="absolute bottom-6 right-4 z-10 pointer-events-auto">
            <button onclick="centerToMyLocation()" class="w-12 h-12 transparent-location-btn rounded-2xl flex items-center justify-center text-white transition hover:scale-105 active:scale-95 shadow-xl" title="موقعیت من">
                <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
        </div>
    </div>

    <script>
        let map;
        let isDarkMap = false;
        let currentCoords = { lat: 35.6892, lng: 51.3890 };
        let tileLayer;
        let myLocationMarker = null;

        window.addEventListener('DOMContentLoaded', () => {
            map = L.map('map', { zoomControl: false }).setView([currentCoords.lat, currentCoords.lng], 13);
            
            tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }).addTo(map);

            // رندر فوری نشانگر در حالت پیش‌فرض
            updateMyLocationMarkerOnMap();

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    currentCoords.lat = position.coords.latitude;
                    currentCoords.lng = position.coords.longitude;
                    if(map) {
                        map.setView([currentCoords.lat, currentCoords.lng], 15, { animate: true });
                        updateMyLocationMarkerOnMap();
                    }
                }, (error) => {
                    console.warn("Geolocation error:", error);
                }, { enableHighAccuracy: true, timeout: 10000 });
            }
        });

        function updateMyLocationMarkerOnMap() {
            if(!map) return;
            if(myLocationMarker) {
                map.removeLayer(myLocationMarker);
            }
            
            const customIcon = L.divIcon({
                className: '',
                html: '<div class="pulse-marker-container"><div class="pulse-ring"></div><div class="pulse-core"></div></div>',
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });

            myLocationMarker = L.marker([currentCoords.lat, currentCoords.lng], { icon: customIcon }).addTo(map);
        }

        function centerToMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    currentCoords.lat = position.coords.latitude;
                    currentCoords.lng = position.coords.longitude;
                    if(map) {
                        map.setView([currentCoords.lat, currentCoords.lng], 16, { animate: true });
                        updateMyLocationMarkerOnMap();
                    }
                }, () => {
                    if(map) {
                        map.setView([currentCoords.lat, currentCoords.lng], 16, { animate: true });
                        updateMyLocationMarkerOnMap();
                    }
                }, { enableHighAccuracy: true, timeout: 10000 });
            } else {
                if(map) {
                    map.setView([currentCoords.lat, currentCoords.lng], 16, { animate: true });
                    updateMyLocationMarkerOnMap();
                }
            }
        }

        function toggleMapTheme() {
            isDarkMap = !isDarkMap;
            const mapContainer = document.getElementById('map');
            
            if (tileLayer) map.removeLayer(tileLayer);

            if (isDarkMap) {
                mapContainer.classList.add('dark-map');
                tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }).addTo(map);
            } else {
                mapContainer.classList.remove('dark-map');
                tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }).addTo(map);
            }
            
            setTimeout(() => { updateMyLocationMarkerOnMap(); }, 100);
        }
    </script>
</body>
</html>
