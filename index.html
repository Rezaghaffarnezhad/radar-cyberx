<!DOCTYPE html>
<html lang="fa" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نقشه لایت و دارک</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');
        body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0e1621; color: #f5f5f5; font-family: 'Vazirmatn', sans-serif; }
        .map-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .glass-box {
            background: rgba(23, 33, 43, 0.45);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .leaflet-container { background-color: #0e1621 !important; }
        .dark-map .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }

        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body class="relative flex flex-col h-full justify-between select-none">

    <div id="view-map" class="view-section relative w-full h-full">
        <div id="map" class="map-container"></div>
        
        <div class="absolute top-3 left-3 right-3 z-10 pointer-events-none">
            <div class="glass-box px-3 py-2 rounded-2xl flex items-center justify-between gap-2 shadow-2xl pointer-events-auto">
                <div class="text-xs font-bold text-white">نقشه زنده</div>
                <div class="flex items-center gap-2">
                    <button onclick="toggleMapTheme()" class="w-8 h-8 rounded-xl flex items-center justify-center text-sm bg-slate-800/80 text-white hover:bg-slate-700 transition shadow" title="تغییر حالت نقشه">🌓</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let map;
        let isDarkMap = false;
        let currentCoords = { lat: 35.6892, lng: 51.3890 };
        let tileLayer;

        window.addEventListener('DOMContentLoaded', () => {
            map = L.map('map', { zoomControl: false }).setView([currentCoords.lat, currentCoords.lng], 13);
            
            // لایه پیش‌فرض (لایت)
            tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    currentCoords.lat = position.coords.latitude;
                    currentCoords.lng = position.coords.longitude;
                    if(map) map.setView([currentCoords.lat, currentCoords.lng], 14, { animate: true });
                }, () => {}, { enableHighAccuracy: true, timeout: 5000 });
            }
        });

        function toggleMapTheme() {
            isDarkMap = !isDarkMap;
            const mapContainer = document.getElementById('map');
            
            if (tileLayer) map.removeLayer(tileLayer);

            if (isDarkMap) {
                mapContainer.classList.add('dark-map');
                tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }).addTo(map);
            } else {
                mapContainer.classList.remove('dark-map');
                tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }).addTo(map);
            }
        }
    </script>
</body>
</html>
