<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Chat & Users</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --tg-theme-bg-color: #0e1621;
            --tg-theme-text-color: #ffffff;
            --tg-theme-hint-color: #708499;
            --tg-bg-glass: rgba(17, 27, 43, 0.95);
            --tg-border-glass: rgba(255, 255, 255, 0.08);
            --accent-blue: #3390ec;
            --accent-online: #4bb34b;
            --msg-out: #2b5278;
            --msg-in: #182533;
        }

        body {
            margin: 0; padding: 0; background-color: var(--tg-theme-bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--tg-theme-text-color); overflow: hidden; user-select: none;
        }

        .app-container {
            display: flex; flex-direction: column; height: 100vh; width: 100vw; box-sizing: border-box;
            position: relative; padding-bottom: 60px;
        }

        .view-panel { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding: 12px; box-sizing: border-box; }
        .view-panel.active { display: flex; }

        /* تب‌بار پایین به سبک تلگرام */
        .telegram-tabbar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 1010;
            background: var(--tg-bg-glass); backdrop-filter: blur(20px);
            border-top: 1px solid var(--tg-border-glass);
            display: flex; justify-content: space-around; align-items: center; height: 60px;
        }
        .tab-item {
            text-decoration: none; display: flex; flex-direction: column; align-items: center;
            justify-content: center; color: var(--tg-theme-hint-color); font-size: 11px; width: 100%; height: 100%;
            cursor: pointer; transition: color 0.2s;
        }
        .tab-item i { font-size: 18px; margin-bottom: 3px; }
        .tab-item.active { color: var(--accent-blue); }

        /* استایل لیست کاربران */
        .user-card {
            background: var(--tg-bg-glass); border: 1px solid var(--tg-border-glass);
            border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 8px; backdrop-filter: blur(10px); cursor: pointer;
        }
        .user-info-side { display: flex; align-items: center; gap: 12px; }
        .user-avatar {
            width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #3390ec, #1b6ac9);
            display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: #fff; overflow: hidden;
            position: relative; flex-shrink: 0;
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .user-meta h4 { margin: 0 0 3px 0; font-size: 14px; color: #fff; }
        .user-meta span { font-size: 11px; color: var(--tg-theme-hint-color); }

        /* استایل بخش چت */
        .chat-messages-box {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px;
        }
        .tg-msg-bubble {
            max-width: 80%; padding: 8px 12px; border-radius: 14px; position: relative;
            font-size: 14px; line-height: 1.4; word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .tg-msg-bubble.incoming {
            background-color: var(--msg-in); align-self: flex-start; border-bottom-left-radius: 4px; color: #fff;
        }
        .tg-msg-bubble.outgoing {
            background-color: var(--msg-out); align-self: flex-end; border-bottom-right-radius: 4px; color: #fff;
        }
        .msg-sender { font-size: 11px; font-weight: bold; color: var(--accent-blue); margin-bottom: 2px; }
        .msg-time { font-size: 9px; color: rgba(255,255,255,0.4); float: left; margin-top: 4px; margin-left: 6px; }

        .chat-input-row {
            display: flex; align-items: center; gap: 8px; margin-top: 6px;
            background: var(--tg-bg-glass); border: 1px solid var(--tg-border-glass);
            border-radius: 22px; padding: 6px 12px; backdrop-filter: blur(20px);
        }
        .chat-input {
            flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; outline: none; padding: 6px 0;
        }
        .chat-send-btn {
            background: var(--accent-blue); border: none; color: #fff; width: 34px; height: 34px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px;
        }

        /* پنل پروفایل من */
        .my-profile-box {
            background: var(--tg-bg-glass); border: 1px solid var(--tg-border-glass);
            border-radius: 20px; padding: 24px; text-align: center; backdrop-filter: blur(20px);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- تب اول: چت عمومی -->
        <div id="chat-view" class="view-panel active">
            <div class="chat-messages-box" id="chat-messages">
                <div style="color: var(--tg-theme-hint-color); font-size: 13px; text-align: center; margin-top: 50px;">در حال بارگذاری پیام‌ها...</div>
            </div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" class="chat-input" placeholder="پیام خود را بنویسید...">
                <button class="chat-send-btn" id="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- تب دوم: افراد آنلاین -->
        <div id="users-view" class="view-panel">
            <h3 style="font-size: 15px; margin: 0 0 12px 4px; color: #fff;">کاربران حاضر در شبکه</h3>
            <div id="users-list-container">
                <div style="color: var(--tg-theme-hint-color); font-size: 13px; text-align: center; margin-top: 50px;">در حال جستجوی کاربران آنلاین...</div>
            </div>
        </div>

        <!-- تب سوم: پروفایل من -->
        <div id="profile-view" class="view-panel" style="align-items: center; justify-content: center;">
            <div class="my-profile-box" style="width: 100%; max-width: 320px;">
                <div class="user-avatar" id="my-profile-avatar" style="width: 70px; height: 70px; margin: 0 auto 12px auto; font-size: 26px;">C</div>
                <h3 id="my-profile-name" style="margin: 0 0 4px 0; font-size: 18px; color: #fff;">کاربر تلگرام</h3>
                <span id="my-profile-username" style="font-size: 13px; color: var(--accent-blue);">@username</span>
                <div style="margin-top: 14px; font-size: 12px; color: var(--accent-online); background: rgba(75, 179, 75, 0.1); padding: 4px 10px; border-radius: 10px; display: inline-block;">
                    ● وضعیت: آنلاین و متصل
                </div>
            </div>
        </div>

        <!-- منوی پایین (تب‌بار) -->
        <nav class="telegram-tabbar">
            <a class="tab-item active" data-target="chat-view"><i class="fas fa-comments"></i><span>چت عمومی</span></a>
            <a class="tab-item" data-target="users-view"><i class="fas fa-users"></i><span>کاربران آنلاین</span></a>
            <a class="tab-item" data-target="profile-view"><i class="fas fa-user"></i><span>پروفایل من</span></a>
        </nav>

    </div>

    <script>
        // آدرس سرور (اگر از سروئو استفاده می‌کنید، لینک فعلی را جایگزین کنید)
        const SERVER_URL = "https://a0dc5d84119789de-5-121-123-107.serveousercontent.com";

        let tg = window.Telegram.WebApp;
        tg.expand();

        let myId = 'user_' + Math.random().toString(36).substring(2, 9);
        let myName = "کاربر مهمان";
        let myUsername = "@guest";
        let myPhotoUrl = "";

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            myId = user.id;
            if (user.first_name) {
                myName = user.first_name;
                if (user.last_name) myName += " " + user.last_name;
            }
            if (user.username) myUsername = "@" + user.username;
            if (user.photo_url) myPhotoUrl = user.photo_url;
        }

        // تنظیم اطلاعات پروفایل در بخش مربوطه
        let avatarEl = document.getElementById('my-profile-avatar');
        if (myPhotoUrl) {
            avatarEl.innerHTML = `<img src="${myPhotoUrl}">`;
        } else {
            avatarEl.innerText = myName.charAt(0);
        }
        document.getElementById('my-profile-name').innerText = myName;
        document.getElementById('my-profile-username').innerText = myUsername;

        // تابع ارسال مشخصات خود به سرور و دریافت لیست افراد آنلاین
        function heartbeat() {
            fetch(SERVER_URL + '/api/connect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: myId,
                    name: myName,
                    username: myUsername,
                    photo_url: myPhotoUrl
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.users) {
                    renderUsersList(data.users);
                }
            })
            .catch(err => console.log("Connection error:", err));
        }

        // رندر کردن لیست کاربران آنلاین در تب دوم
        function renderUsersList(users) {
            let container = document.getElementById('users-list-container');
            container.innerHTML = '';

            if (users.length === 0) {
                container.innerHTML = `<div style="color: var(--tg-theme-hint-color); font-size: 13px; text-align: center; margin-top: 50px;">هنوز کاربر دیگری آنلاین نشده است.</div>`;
                return;
            }

            users.forEach(user => {
                let userAvatarHTML = user.photo_url 
                    ? `<img src="${user.photo_url}">` 
                    : user.name.charAt(0);

                let card = document.createElement('div');
                card.className = 'user-card';
                card.innerHTML = `
                    <div class="user-info-side">
                        <div class="user-avatar">${userAvatarHTML}</div>
                        <div class="user-meta">
                            <h4>${user.name}</h4>
                            <span>${user.username}</span>
                        </div>
                    </div>
                    <span style="font-size: 11px; color: var(--accent-online);">● آنلاین</span>
                `;
                
                // کلیک روی کاربر برای باز کردن چت خصوصی تلگرام با او
                card.addEventListener('click', () => {
                    if (user.username && user.username !== '@user' && user.username !== '@guest') {
                        let cleanUser = user.username.replace('@', '');
                        window.open(`https://t.me/${cleanUser}`, '_blank');
                    } else {
                        alert("این کاربر نام کاربری تلگرام ندارد.");
                    }
                });

                container.appendChild(card);
            });
        }

        // دریافت پیام‌های چت عمومی
        function fetchMessages() {
            fetch(SERVER_URL + '/api/chat')
            .then(res => res.json())
            .then(data => {
                let chatBox = document.getElementById('chat-messages');
                if (data.messages) {
                    if (data.messages.length === 0) {
                        chatBox.innerHTML = `<div style="color: var(--tg-theme-hint-color); font-size: 13px; text-align: center; margin-top: 50px;">هنوز پیامی ارسال نشده است. اولین پیام باشید!</div>`;
                        return;
                    }

                    let isScrolledToBottom = chatBox.scrollHeight - chatBox.scrollTop <= chatBox.clientHeight + 60;
                    
                    chatBox.innerHTML = '';
                    data.messages.forEach(msg => {
                        let isMe = String(msg.user_id) === String(myId);
                        let bubble = document.createElement('div');
                        bubble.className = `tg-msg-bubble ${isMe ? 'outgoing' : 'incoming'}`;
                        
                        let senderHeader = !isMe ? `<div class="msg-sender">${msg.name}</div>` : '';
                        
                        bubble.innerHTML = `
                            ${senderHeader}
                            <div>${msg.text}</div>
                            <span class="msg-time">${msg.time}</span>
                        `;
                        chatBox.appendChild(bubble);
                    });

                    if (isScrolledToBottom) {
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }
            })
            .catch(err => console.log("Chat error:", err));
        }

        // ارسال پیام در چت
        function sendMessage() {
            let input = document.getElementById('chat-input');
            let text = input.value.trim();
            if (!text) return;

            fetch(SERVER_URL + '/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: myId,
                    name: myName,
                    photo_url: myPhotoUrl,
                    text: text
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    input.value = '';
                    fetchMessages();
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                }
            })
            .catch(err => alert("خطا در ارسال پیام"));
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // مدیریت تب‌های برنامه
        document.querySelectorAll('.tab-item').forEach(tab => {
            tab.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                const target = tab.getAttribute('data-target');
                document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));
                document.getElementById(target).classList.add('active');

                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            });
        });

        // لوپ‌های زمانی برای بروزرسانی خودکار
        heartbeat();
        fetchMessages();
        setInterval(heartbeat, 3000);
        setInterval(fetchMessages, 2000);
    </script>
</body>
</html>
