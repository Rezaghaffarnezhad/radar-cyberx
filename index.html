<!DOCTYPE html>
<html lang="fa" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تلسکوپ - ردیابی لحظه‌ای کاربران</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- کتابخانه Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');
        body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0e1621; color: #f5f5f5; font-family: 'Vazirmatn', sans-serif; }
        .map-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .glass-box {
            background: rgba(23, 33, 43, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tg-card { background: #17212b; border: 1px solid rgba(255,255,255,0.04); }
        .leaflet-container { background-color: #0e1621 !important; }
        .dark-map .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }

        .animated-my-pin {
            width: 22px !important;
            height: 22px !important;
            background-color: #3b82f6 !important;
            border: 3px solid #ffffff !important;
            border-radius: 50% !important;
            box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            animation: pulse-shadow 2s infinite ease-out;
            margin-top: -11px !important;
            margin-left: -11px !important;
            z-index: 1000 !important;
        }

        @keyframes pulse-shadow {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 16px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        .other-user-pin {
            width: 40px !important;
            height: 40px !important;
            border-radius: 50%;
            background: #1e293b;
            border: 2.5px solid #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 13px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            position: relative;
        }

        .online-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border: 2px solid #1e293b;
            border-radius: 50%;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    </style>
</head>
<body class="relative flex flex-col h-full justify-between select-none">

    <div class="relative w-full h-full">
        <div id="map" class="map-container dark-map"></div>
        
        <!-- هدر بالای صفحه -->
        <div class="absolute top-3 left-3 right-3 z-10 pointer-events-none">
            <div class="glass-box px-3 py-2 rounded-2xl flex items-center justify-between gap-2 shadow-2xl pointer-events-auto">
                <div class="flex items-center gap-2">
                    <span id="status-badge" class="text-[11px] font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1.5 rounded-xl">⚡ آنلاینِ لحظه‌ای</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="flex items-center gap-1.5">
                        <span id="top-my-name" class="font-bold text-xs text-white truncate max-w-[100px]">کاربر</span>
                        <div id="top-my-avatar" class="w-8 h-8 rounded-full bg-[#2b5278] flex items-center justify-center font-bold text-white text-xs overflow-hidden shadow">ک</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- دکمه تنظیم شعاع -->
        <div class="absolute bottom-24 left-4 z-10 flex flex-col gap-2 pointer-events-auto">
            <button onclick="openRadiusModal()" class="w-12 h-12 glass-box rounded-2xl flex items-center justify-center text-blue-400 shadow-xl transition hover:scale-105 active:scale-95" title="تنظیم شعاع نقشه">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
        </div>

        <!-- دکمه‌های سمت راست (لیست افراد آنلاین + موقعیت من) -->
        <div class="absolute bottom-6 right-4 z-10 flex flex-col gap-2 pointer-events-auto">
            <button onclick="openUsersListModal()" class="w-12 h-12 bg-slate-800/80 hover:bg-slate-700 rounded-2xl flex items-center justify-center text-white transition hover:scale-105 active:scale-95 shadow-xl border border-white/10" title="لیست افراد آنلاین">
                <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            </button>
            <button onclick="centerToMyLocation()" class="w-12 h-12 bg-slate-800/80 hover:bg-slate-700 rounded-2xl flex items-center justify-center text-white transition hover:scale-105 active:scale-95 shadow-xl border border-white/10" title="موقعیت من">
                <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
        </div>
    </div>

    <!-- مودال تنظیم شعاع -->
    <div id="radius-modal" class="hidden absolute inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onclick="closeRadiusModal()">
        <div class="tg-card w-full max-w-sm rounded-2xl p-5 flex flex-col gap-4 shadow-2xl border border-slate-700" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                <h3 class="font-bold text-sm text-white flex items-center gap-2">⚙️ تنظیم شعاع نقشه</h3>
                <button onclick="closeRadiusModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>
            
            <div class="flex flex-col gap-2">
                <div class="flex justify-between items-center text-xs text-slate-300">
                    <span>شعاع نقشه:</span>
                    <span id="modal-radius-value" class="text-blue-400 font-bold">15 کیلومتر</span>
                </div>
                <input id="modal-radius-slider" type="range" min="1" max="50" step="1" value="15" oninput="onRadiusChange(this.value)" class="w-full accent-blue-500 cursor-pointer">
            </div>

            <button onclick="closeRadiusModal()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 rounded-xl font-medium text-xs text-white transition mt-1">تایید</button>
        </div>
    </div>

    <!-- مودال لیست افراد آنلاین -->
    <div id="users-list-modal" class="hidden absolute inset-0 bg-black/70 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="closeUsersListModal()">
        <div class="tg-card w-full max-w-md max-h-[85vh] rounded-t-3xl sm:rounded-2xl p-5 flex flex-col gap-3 shadow-2xl border border-slate-700 overflow-hidden" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                <h3 class="font-bold text-sm text-white flex items-center gap-2">🟢 لیست افراد آنلاین لحظه‌ای</h3>
                <button onclick="closeUsersListModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>
            
            <!-- باکس جستجو -->
            <div class="relative w-full">
                <input type="text" id="user-search-input" oninput="filterUsersList(this.value)" placeholder="جستجو بر اساس نام یا یوزرنیم (@)..." class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 px-3 pr-9 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-blue-500">
                <svg class="w-4 h-4 text-slate-400 absolute right-3 top-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>

            <!-- لیست کاربران آنلاین -->
            <div id="users-scroll-container" class="flex flex-col gap-2 overflow-y-auto max-h-[45vh] pr-1">
                <div class="text-center text-xs text-slate-400 py-6">در حال دریافت کاربران...</div>
            </div>

            <button onclick="closeUsersListModal()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl font-medium text-xs text-white transition mt-1">بستن</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dxdskvkcmovotzxixxhd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3-rNuWmg9jAyPPQ89hE4ZQ_avo0wsPd';
        let supabaseClient = null;
        
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("Supabase init error:", e);
        }

        let tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        let map = null, myLocationMarker = null, radiusCircle = null;
        let markersLayerGroup = L.layerGroup(); 
        let onlineUsersList = []; 
        let currentCoords = { lat: 35.6892, lng: 51.3890 }; 
        let activeRadiusKm = 15;

        const tgUser = tg?.initDataUnsafe?.user;
        let currentUser = { 
            id: tgUser ? String(tgUser.id) : String(Math.floor(Math.random() * 900000) + 100000),
            name: tgUser ? `${tgUser.first_name || ''} ${tgUser.last_name || ''}`.trim() : "کاربر تستی",
            username: tgUser?.username || 'guest_user',
            avatar_url: tgUser?.photo_url || ''
        };

        window.addEventListener('DOMContentLoaded', () => {
            try {
                map = L.map('map', { zoomControl: false }).setView([currentCoords.lat, currentCoords.lng], 15);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }).addTo(map);
                
                markersLayerGroup.addTo(map);

                setupUserUI();
                updateMapElements();

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            currentCoords.lat = position.coords.latitude;
                            currentCoords.lng = position.coords.longitude;
                            
                            if(map) {
                                map.setView([currentCoords.lat, currentCoords.lng], 16, { animate: true });
                                updateMapElements();
                            }
                            saveAndSyncData();
                        }, 
                        (error) => {
                            console.warn("Geolocation warning:", error.message);
                            saveAndSyncData();
                        }, 
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                } else {
                    saveAndSyncData();
                }

                // راه‌اندازی اتصال لحظه‌ای (Realtime)
                setupRealtimeSubscription();

            } catch (err) {
                console.error("Initialization error:", err);
            }
        });

        function setupUserUI() {
            try {
                document.getElementById('top-my-name').textContent = currentUser.name;
                const avatarEl = document.getElementById('top-my-avatar');
                if(currentUser.avatar_url) {
                    avatarEl.innerHTML = `<img src="${currentUser.avatar_url}" class="w-full h-full object-cover">`;
                } else {
                    avatarEl.textContent = currentUser.name.charAt(0) || 'ک';
                }
            } catch (e) {
                console.warn("UI setup warning:", e);
            }
        }

        function updateMapElements() {
            try {
                if(!map) return;

                if(radiusCircle) map.removeLayer(radiusCircle);
                if(myLocationMarker) map.removeLayer(myLocationMarker);

                radiusCircle = L.circle([currentCoords.lat, currentCoords.lng], {
                    radius: activeRadiusKm * 1000,
                    color: '#3b82f6',
                    weight: 1.5,
                    fillColor: '#3b82f6',
                    fillOpacity: 0.08
                }).addTo(map);

                const customIcon = L.divIcon({ 
                    html: '<div class="animated-my-pin"></div>', 
                    iconSize: [22, 22], 
                    iconAnchor: [11, 11], 
                    className: '' 
                });

                myLocationMarker = L.marker([currentCoords.lat, currentCoords.lng], { icon: customIcon, zIndexOffset: 1000 }).addTo(map);
            } catch (err) {
                console.error("Error updating map elements:", err);
            }
        }

        async function saveAndSyncData() {
            if (!supabaseClient) return;
            try {
                await supabaseClient.from('users').upsert({
                    id: currentUser.id,
                    name: currentUser.name,
                    username: currentUser.username,
                    avatar_url: currentUser.avatar_url,
                    lat: currentCoords.lat,
                    lng: currentCoords.lng,
                    updated_at: new Date()
                }, { onConflict: 'id' });

                fetchAllUsers();
            } catch (err) {
                console.error("Error saving location:", err);
            }
        }

        // دریافت اولیه کل کاربران
        async function fetchAllUsers() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*');

                if (error) {
                    console.error("Fetch error:", error);
                    return;
                }

                if (data) {
                    processUsersData(data);
                }
            } catch (err) {
                console.error("Error fetching users:", err);
            }
        }

        // گوش دادن به تغییرات لحظه‌ای دیتابیس (Realtime)
        function setupRealtimeSubscription() {
            if (!supabaseClient) return;

            supabaseClient
                .channel('public:users')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, payload => {
                    console.log('Realtime change received:', payload);
                    fetchAllUsers(); // به محض تغییر، لیست و نقشه به‌روز می‌شود
                })
                .subscribe((status) => {
                    console.log("Realtime status:", status);
                });

            // بارگذاری اولیه
            fetchAllUsers();
        }

        function processUsersData(data) {
            markersLayerGroup.clearLayers();
            onlineUsersList = [];

            // افزودن خود کاربر به لیست محلی
            onlineUsersList.push({
                id: currentUser.id,
                name: currentUser.name,
                username: currentUser.username,
                avatar_url: currentUser.avatar_url,
                lat: currentCoords.lat,
                lng: currentCoords.lng,
                distance: 0,
                isMe: true
            });

            data.forEach(user => {
                if (String(user.id) === String(currentUser.id)) return;
                if (!user.lat || !user.lng) return;

                const distanceKm = getDistanceFromLatLonInKm(currentCoords.lat, currentCoords.lng, user.lat, user.lng);
                
                onlineUsersList.push({ ...user, distance: distanceKm, isMe: false });

                // ترسیم پین روی نقشه
                const userInitial = user.name ? user.name.charAt(0) : 'ک';
                const avatarHtml = user.avatar_url 
                    ? `<img src="${user.avatar_url}" class="w-full h-full object-cover">` 
                    : userInitial;

                const pinHtml = `<div class="other-user-pin">${avatarHtml}<div class="online-dot"></div></div>`;
                
                const userIcon = L.divIcon({
                    html: pinHtml,
                    iconSize: [40, 40],
                    iconAnchor: [20, 20],
                    className: ''
                });

                const marker = L.marker([user.lat, user.lng], { icon: userIcon });
                marker.bindPopup(`<div style="direction: rtl; font-family: 'Vazirmatn'; text-align: right;"><b style="color: #10b981;">${user.name || 'کاربر'} (آنلاین)</b><br><span style="font-size: 11px; color: #64748b;">@${user.username || 'بدون نام کاربری'}</span><br><span style="font-size: 11px; color: #10b981;">فاصله: ${distanceKm.toFixed(1)} کیلومتر</span></div>`);
                
                markersLayerGroup.addLayer(marker);
            });
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                Math.sin(dLon/2) * Math.sin(dLon/2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c;
        }

        function deg2rad(deg) {
            return deg * (Math.PI/180);
        }

        function centerToMyLocation() {
            try {
                if(map) {
                    map.setView([currentCoords.lat, currentCoords.lng], 16, { animate: true });
                }
            } catch (e) {
                console.warn("Center map warning:", e);
            }
        }

        function openRadiusModal() {
            document.getElementById('modal-radius-slider').value = activeRadiusKm;
            document.getElementById('modal-radius-value').textContent = `${activeRadiusKm} کیلومتر`;
            document.getElementById('radius-modal').classList.remove('hidden');
        }

        function closeRadiusModal() {
            document.getElementById('radius-modal').classList.add('hidden');
        }

        function onRadiusChange(val) {
            activeRadiusKm = parseFloat(val);
            document.getElementById('modal-radius-value').textContent = `${activeRadiusKm} کیلومتر`;
            updateMapElements();
        }

        function openUsersListModal() {
            document.getElementById('user-search-input').value = '';
            renderUsersList(onlineUsersList);
            document.getElementById('users-list-modal').classList.remove('hidden');
        }

        function closeUsersListModal() {
            document.getElementById('users-list-modal').classList.add('hidden');
        }

        function filterUsersList(query) {
            const q = query.trim().toLowerCase();
            if (!q) {
                renderUsersList(onlineUsersList);
                return;
            }
            const filtered = onlineUsersList.filter(u => {
                const nameMatch = u.name && u.name.toLowerCase().includes(q);
                const usernameMatch = u.username && u.username.toLowerCase().includes(q);
                return nameMatch || usernameMatch;
            });
            renderUsersList(filtered);
        }

        function renderUsersList(usersArray) {
            const container = document.getElementById('users-scroll-container');
            container.innerHTML = '';

            if (usersArray.length === 0) {
                container.innerHTML = `<div class="text-center text-xs text-slate-400 py-6">کاربر دیگری یافت نشد.</div>`;
                return;
            }

            usersArray.sort((a, b) => a.distance - b.distance);

            usersArray.forEach(user => {
                const userInitial = user.name ? user.name.charAt(0) : 'ک';
                const avatarHtml = user.avatar_url 
                    ? `<img src="${user.avatar_url}" class="w-full h-full object-cover">` 
                    : userInitial;

                const badgeHtml = user.isMe 
                    ? `<span class="text-[9px] font-bold text-blue-400 bg-blue-500/10 px-1.5 py-0.5 rounded mr-1.5">شما</span>` 
                    : `<span class="text-[9px] font-bold text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded mr-1.5">آنلاین</span>`;

                const distanceBadge = user.isMe 
                    ? `<span class="text-[11px] font-bold text-blue-400 bg-blue-500/10 px-2 py-1 rounded-lg">موقعیت من</span>`
                    : `<span class="text-[11px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded-lg">${user.distance.toFixed(1)} کیلومتر</span>`;

                const itemHtml = `
                    <div onclick="focusOnUser(${user.lat}, ${user.lng})" class="flex items-center justify-between p-2.5 bg-slate-800/60 hover:bg-slate-800 rounded-xl cursor-pointer transition border border-slate-700/50">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-emerald-600/30 border border-emerald-400/30 flex items-center justify-center font-bold text-white text-xs overflow-hidden shadow relative">
                                ${avatarHtml}
                            </div>
                            <div class="flex flex-col">
                                <div class="flex items-center">
                                    <span class="font-bold text-xs text-white">${user.name || 'کاربر'}</span>
                                    ${badgeHtml}
                                </div>
                                <span class="text-[10px] text-slate-400">@${user.username || 'بدون نام کاربری'}</span>
                            </div>
                        </div>
                        <div class="text-left">
                            ${distanceBadge}
                        </div>
                    </div>
                `;
                container.innerHTML += itemHtml;
            });
        }

        function focusOnUser(lat, lng) {
            closeUsersListModal();
            if (map) {
                map.setView([lat, lng], 17, { animate: true });
            }
        }
    </script>
</body>
</html>
